        variation_values:
          type: array
          items:
            $ref: "#/components/schemas/VariationValue"
        thumbnail:
          type:
            - string
            - "null"
    OnlinePrice:
      allOf:
        - $ref: "#/components/schemas/PriceSkuBase"
        - type: object
          properties:
            last_modified:
              type:
                - string
                - "null"
              format: date-time
              description: Last price change
            default_price:
              type:
                - number
                - "null"
              example: 75000
            store_prices:
              type: array
              items:
                type: object
                properties:
                  channel_id:
                    $ref: "#/components/schemas/ChannelId"
                  store_id:
                    type: integer
                    example: 9
                  store_name:
                    type:
                      - string
                      - "null"
                    example: Toko A
                  price:
                    type:
                      - number
                      - "null"
                    example: 79000
                  is_listed:
                    type: boolean
                    description: Sold on this store
    OfflinePrice:
      allOf:
        - $ref: "#/components/schemas/PriceSkuBase"
        - type: object
          properties:
            default_price:
              type:
                - number
                - "null"
              example: 75000
            location_prices:
              type: array
              items:
                type: object
                properties:
                  location_id:
                    type: integer
                    example: 3
                  location_name:
                    type: string
                    example: Gudang Utama
                  is_pos_outlet:
                    type: boolean
                  price:
                    type:
                      - number
                      - "null"
                    example: 72000
                  is_custom:
                    type: boolean
                    description: true = location has its own price; false = default price
    PromotionType:
      type: string
      enum:
        - channel
        - pos_discount
        - pos_min_qty
        - pos_buy_x_get_y
        - pos_free_item_min_trans
    PromotionPrice:
      type: object
      properties:
        promotion_id:
          type: integer
          example: 31
        promotion_name:
          type: string
          example: Promo 10.10
        promotion_type:
          $ref: "#/components/schemas/PromotionType"
        sku_id:
          type: integer
          example: 5001
        sku_code:
          type: string
          example: KAOS-M
        sku_name:
          type: string
          example: Kaos Polos - M
        variation_values:
          type: array
          items:
            $ref: "#/components/schemas/VariationValue"
        thumbnail:
          type:
            - string
            - "null"
        sell_price:
          type:
            - number
            - "null"
          example: 75000
          description: null for rule-based POS promotions
        promotion_price:
          type:
            - number
            - "null"
          example: 69000
          description: null for rule-based POS promotions
        channels:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type:
                  - integer
                  - "null"
                example: 64
              store_id:
                type:
                  - integer
                  - "null"
                example: 9
              channel_name:
                type:
                  - string
                  - "null"
                example: Shopee - Toko A
    PriceSyncFailure:
      type: object
      properties:
        log_id:
          type: integer
          example: 9912
        failed_at:
          type: string
          format: date-time
        product_id:
          type: integer
          example: 101
        product_name:
          type: string
          example: Kaos Polos
        sku_id:
          type:
            - integer
            - "null"
          example: 5001
        sku_code:
          type:
            - string
            - "null"
          example: KAOS-M
        sku_name:
          type:
            - string
            - "null"
          example: Kaos Polos - M
        channel_id:
          $ref: "#/components/schemas/ChannelId"
        store_id:
          type: integer
          example: 9
        store_name:
          type:
            - string
            - "null"
          example: Toko A
        price:
          type:
            - number
            - "null"
          example: 79000
        error_message:
          type:
            - string
            - "null"
          description: Message from the marketplace
        adjustment_id:
          type:
            - integer
            - "null"
          example: 120
        adjustment_no:
          type:
            - string
            - "null"
          example: TRX-000000120
    PriceAdjustment:
      type: object
      properties:
        adjustment_id:
          type: integer
          example: 120
        adjustment_no:
          type: string
          example: TRX-000000120
        type:
          type: string
          enum:
            - online
            - offline
        note:
          type:
            - string
            - "null"
        created_by:
          type:
            - string
            - "null"
          description: User or app code that created the adjustment
        created_at:
          type:
            - string
            - "null"
          format: date-time
        item_count:
          type:
            - integer
            - "null"
          example: 25
        synced_count:
          type:
            - integer
            - "null"
          example: 23
    PriceAdjustmentItem:
      type: object
      properties:
        sku_id:
          type: integer
          example: 5001
        sku_code:
          type: string
          example: KAOS-M
        sku_name:
          type: string
          example: Kaos Polos - M
        error_count:
          type: integer
          example: 1
        prices:
          type: array
          items:
            type: object
            properties:
              store_id:
                type:
                  - integer
                  - "null"
                description: -1 = default price; null for offline
              channel_id:
                type:
                  - integer
                  - "null"
              store_name:
                type:
                  - string
                  - "null"
              location_id:
                type:
                  - integer
                  - "null"
                description: Offline adjustments only
              price:
                type:
                  - number
                  - "null"
                example: 79000
              is_error:
                type: boolean
              message:
                type:
                  - string
                  - "null"
                description: Sync result or error message
    PriceAdjustmentInput:
      type: object
      required:
        - type
        - items
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - online
            - offline
        note:
          type: string
          maxLength: 1000
        items:
          type: array
          minItems: 1
          description: |
            One entry per SKU (unique `sku_id`). Prices are integers >= 0.
            - `online`: send `default_price` and/or `store_prices`
            - `offline`: send `location_prices`
          items:
            type: object
            required:
              - sku_id
            additionalProperties: false
            properties:
              sku_id:
                type: integer
                example: 5001
              default_price:
                type: integer
                minimum: 0
                example: 75000
              store_prices:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - store_id
                    - price
                  properties:
                    store_id:
                      type: integer
                      example: 9
                    price:
                      type: integer
                      minimum: 0
                      example: 79000
              location_prices:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - location_id
                    - price
                  properties:
                    location_id:
                      type: integer
                      example: 3
                    price:
                      type: integer
                      minimum: 0
                      example: 72000
