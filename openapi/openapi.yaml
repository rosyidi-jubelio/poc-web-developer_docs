        sku_name:
          type: string
          example: Kaos Polos - M
        error_count:
          type: integer
          example: 1
        prices:
          type: array
          items:
            type: object
            properties:
              store_id:
                type:
                  - integer
                  - "null"
                description: -1 = default price; null for offline
              channel_id:
                type:
                  - integer
                  - "null"
              store_name:
                type:
                  - string
                  - "null"
              location_id:
                type:
                  - integer
                  - "null"
                description: Offline adjustments only
              price:
                type:
                  - number
                  - "null"
                example: 79000
              is_error:
                type: boolean
              message:
                type:
                  - string
                  - "null"
                description: Sync result or error message
    PriceAdjustmentInput:
      type: object
      required:
        - type
        - items
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - online
            - offline
        note:
          type: string
          maxLength: 1000
        items:
          type: array
          minItems: 1
          description: |
            One entry per SKU (unique `sku_id`). Prices are integers >= 0.
            - `online`: send `default_price` and/or `store_prices`
            - `offline`: send `location_prices`
          items:
            type: object
            required:
              - sku_id
            additionalProperties: false
            properties:
              sku_id:
                type: integer
                example: 5001
              default_price:
                type: integer
                minimum: 0
                example: 75000
              store_prices:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - store_id
                    - price
                  properties:
                    store_id:
                      type: integer
                      example: 9
                    price:
                      type: integer
                      minimum: 0
                      example: 79000
              location_prices:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - location_id
                    - price
                  properties:
                    location_id:
                      type: integer
                      example: 3
                    price:
                      type: integer
                      minimum: 0
                      example: 72000
