          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Journal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /regions:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Reference
      summary: List regions
      description: |
        Indonesian administrative regions, one level per call. Reference data,
        so no scope is required beyond a valid access token. `parent_id` is
        required for every level except `province`, and is the `id` of the
        level above.
      operationId: listRegions
      parameters:
        - name: level
          in: query
          required: true
          schema:
            type: string
            enum:
              - province
              - city
              - district
              - subdistrict
        - name: parent_id
          in: query
          description: Required unless level is province
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Region"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token obtained from `POST /oauth/token`. Send it as
        `Authorization: Bearer <token>` on every gateway request, together
        with the `x-jbl-merchant-id` header naming the merchant the token was
        issued for. A token
        only authorizes the scopes the merchant approved at install; a call
        outside those scopes gets `403` with `error.code: endpoint_not_authorized`.
  parameters:
    JblMerchantId:
      name: x-jbl-merchant-id
      in: header
      required: true
      description: |
        The merchant this call acts on. Send the `merchant_id` that came back
        with the access token from `POST /oauth/token`. A request without it
        gets `400` with `missing_merchant`; a merchant other than the token's
        gets `401`.
      schema:
        $ref: "#/components/schemas/MerchantId"
    Page:
      name: page
      in: query
      description: "Page number to return, starting at 1. There is no total count: keep requesting the next page until `data` has fewer rows than `page_size`."
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Maximum number of rows per page, from 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Q:
      name: q
      in: query
      description: Case-insensitive search text. Empty string matches everything.
      schema:
        type: string
        default: ""
    CategoryId:
      name: category_id
      in: path
      required: true
      description: Jubelio category id
      schema:
        type: integer
        minimum: 1
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ChannelId"
    ProductId:
      name: product_id
      in: path
      required: true
      description: Product id
      schema:
        type: integer
        minimum: 1
        example: 101
    AdjustmentId:
      name: adjustment_id
      in: path
      required: true
      description: Price adjustment id
      schema:
        type: integer
        minimum: 1
        example: 120
  responses:
    BadRequest:
      description: |
        The request body, query, or path failed validation, or the
        `x-jbl-merchant-id` header is missing (`missing_merchant`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: bad_request
              message: grant_type is required
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    Unauthorized:
      description: |
        The access token is missing, malformed, expired, or has been
        revoked (for example, the app was uninstalled), or `x-jbl-merchant-id`
        names a merchant other than the one the token was issued for.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: unauthorized
              message: token_expired
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: location_not_found
              message: location_not_found
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    Forbidden:
      description: |
        The token is valid but was not granted the scope this endpoint
        requires.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: endpoint_not_authorized
              message: "endpoint_not_authorized: this endpoint is not authorized for the current access token (requires scope: product.read)"
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    ValidationError:
      description: |
        Request validation failed.
        Error code: `validation_error`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: validation_error
              message: '"page_size" must be less than or equal to 100'
            request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
    InternalError:
      description: |
        Unexpected server error. The message is generic.
        Error code: `internal_error`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryNotFound:
      description: |
        Category does not exist.
        Error code: `category_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryMappingNotFound:
      description: |
        The category is not mapped to this channel yet. Map it first with
        `POST /catalog/categories/mappings`.
        Error code: `category_mapping_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CustomCategoryDisabled:
      description: |
        The merchant uses Jubelio's default category tree, which cannot be changed.
        Write endpoints are only available when custom categories are enabled.
        Error code: `custom_category_disabled`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProductNotFound:
      description: |
        Product does not exist.
        Error code: `product_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProductValidationFailed:
      description: |
        Business validation failed. `message` carries the reason.
        Error code: `product_validation_failed`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: product_validation_failed
              message: "product_validation_failed: SKU KAOS-M sudah digunakan"
            request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
    ProductRejected:
      description: |
        Request validation failed (`validation_error`) or the product was rejected (`product_rejected`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BarcodeTaken:
      description: |
        A barcode is already used by another SKU.
        Error code: `barcode_taken`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdjustmentNotFound:
      description: |
        Price adjustment does not exist.
        Error code: `adjustment_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  headers:
    XRequestId:
      description: |
        Correlation ID for this request, a UUID generated fresh per request.
        Matches the `request_id` field in the response body.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Lowercase snake_case identifier.
        message:
          type: string
          description: Human-readable detail, for debugging only.
    Envelope:
      type: object
      title: Success envelope
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          description: The payload. An object for a single resource, an array for a list.
        meta:
          type: "null"
          description: null for non-paginated endpoints.
        error:
          description: Always `null` on success.
          type: "null"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    PaginatedEnvelope:
      type: object
      title: Success envelope (paginated)
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          description: The rows of this page. Empty when there are no more rows.
          type: array
        meta:
          description: "Paging of this response. There is no total count: keep requesting the next `page` until `data` has fewer rows than `page_size`."
          type: object
          required:
            - page
            - page_size
          properties:
            page:
              type: integer
              description: The page returned, the same as the `page` query parameter.
            page_size:
              type: integer
              description: The maximum number of rows per page, the same as the `page_size` query parameter.
        error:
          description: Always `null` on success.
          type: "null"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    ErrorEnvelope:
      type: object
      title: Error envelope
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          type: "null"
          description: Always `null` on error.
        meta:
          type: "null"
          description: Always `null` on error.
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
        code:
          type: string
          description: Required when grant_type is authorization_code. Single-use.
        redirect_uri:
          type: string
          format: uri
          description: Required when grant_type is authorization_code. Must match the URI used to start the flow.
        refresh_token:
          type: string
          description: Required when grant_type is refresh_token.
        client_id:
          type: string
        client_secret:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Present for standalone apps. Absent for embedded token flows.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        merchant_id:
          $ref: "#/components/schemas/MerchantId"
        scopes:
          type: array
          items:
            type: string
          description: The scope codes the merchant granted.
    MerchantId:
      type: string
      description: The merchant your app acts on. You receive it with the access token from `POST /oauth/token`.
      example: 7K2QX9M4BDH3
    MerchantProfile:
      type: object
      properties:
        merchant_id:
          $ref: "#/components/schemas/MerchantId"
        company_name:
          type: string
          description: The merchant's company name as recorded when it installed the app.
        subscription:
          oneOf:
            - $ref: "#/components/schemas/AppSubscription"
            - type: "null"
          description: The merchant's subscription to the calling app. `null` for a free app.
    AppSubscription:
      type: object
      properties:
        status:
          type: string
          enum:
            - trial
            - active
            - over_due
            - cancelled
            - expired
          description: |
            - `trial`: inside the 7 day trial that started at install.
            - `active`: a paid period is running.
            - `over_due`: a paid period ended without renewal, inside the 7 day grace period.
            - `cancelled`: the merchant cancelled. Access stays until `current_period_ends_at`, with no grace period and no further charge.
            - `expired`: the trial ended unpaid, the grace period ran out, or a cancelled period ended.
        plan:
          type: object
          description: The plan the merchant is on, as defined by the developer in Dev Console.
          properties:
            plan_id:
              type: integer
            name:
              type: string
        billing_cycle:
          type:
            - string
            - "null"
          enum:
            - monthly
            - yearly
            - null
          description: "`null` until the merchant pays for a first period."
        trial_ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: End of the trial. `null` when the merchant never had one.
        current_period_ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: End of the current trial or paid period.
        grace_period_ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: Last moment the app keeps access while `over_due`. `null` in any other status.
      example:
        status: over_due
        plan:
          plan_id: 12
          name: Pro
        billing_cycle: monthly
        trial_ends_at: 2026-10-20T10:00:00Z
        current_period_ends_at: 2026-11-01T00:00:00Z
        grace_period_ends_at: 2026-11-08T00:00:00Z
    TransferOrder:
      type: object
      properties:
        transfer_id:
          type: integer
        transfer_no:
          type: string
        source_location:
          type: string
        destination_location:
          type: string
        transaction_date:
          type: string
          format: date-time
        is_printed:
          type: boolean
          description: Whether the transfer has been finalized.
    InvoiceSummary:
      type: object
      properties:
        invoice_id:
          type: integer
          description: ID of the invoice.
        invoice_no:
          type: string
          example: INV-000051816
          description: Invoice number, generated by Jubelio when the invoice is created.
        contact_id:
          type: integer
          description: ID of the customer contact. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Customer name as stored on the invoice.
        ref_no:
          type:
            - string
            - "null"
          description: Reference number. When it is a sales order number, the invoice was made from that sales order.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the invoice.
        due_date:
          type: string
          format: date-time
          description: Date payment is due.
        grand_total:
          type: number
          description: Total amount of the invoice, after discounts, tax, fees and additional costs.
        due:
          type: number
          description: Amount still unpaid after payments and returns.
        status:
          type: string
          enum:
            - paid
            - unpaid
            - overdue
          description: "Payment status. `paid`: `due` is 0 or less. `overdue`: `due` is above 0 and `due_date` is today or earlier. `unpaid`: `due` is above 0 and `due_date` is after today."
        created_at:
          type: string
          format: date-time
          description: Time the invoice was created.
        last_modified:
          type: string
          format: date-time
          description: Time the invoice was last changed.
    InvoiceLine:
      type: object
      properties:
        invoice_detail_id:
          type: integer
          description: ID of the invoice line.
        item_id:
          type: integer
          description: ID of the item (SKU), the same as `sku_id` in `GET /catalog/products`.
        item_code:
          type: string
          description: SKU code of the item.
        item_name:
          type: string
          description: Name of the item.
        description:
          type:
            - string
            - "null"
          description: Line description. When none is stored, the item name followed by its variant values, or the item name alone when it has no variants.
        unit:
          type:
            - string
            - "null"
          description: Unit of measure of the line. Invoices created through the API use the item's selling unit.
        qty:
          type: number
          description: Quantity sold, in `unit`. `price` is per `unit`.
        price:
          type: number
          description: Unit price. Includes tax when the invoice `is_tax_included` is `true`.
        disc:
          type: number
          description: Line discount, percent.
        disc_amount:
          type: number
          description: Line discount as an amount for the whole line (not per unit).
        tax_id:
          type:
            - integer
            - "null"
          description: ID of the tax on the line. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax.
        tax_rate:
          type:
            - number
            - "null"
          description: Rate of the tax in percent, e.g. `11` for 11%. Read from the current tax setup, not stored on the invoice.
        tax_amount:
          type: number
          description: Tax of the line. When `is_tax_included` is `true` it is the tax part of `amount`; otherwise it is added on top of `amount`.
        amount:
          type: number
          description: "Line amount: `price` x `qty` minus the line discount and the line's share of `add_disc`, never below 0. Includes tax when `is_tax_included` is `true`; otherwise tax is added on top."
        sales_account_id:
          type:
            - integer
            - "null"
          description: ID of the sales account the line is booked to. See `GET /finance/accounts`.
        location_id:
          type:
            - integer
            - "null"
          description: "ID of the location the line's stock goes out from: the sales order line's location for an invoice made from a sales order, otherwise the invoice `location_id`. See `GET /locations`."
        bin_id:
          type:
            - integer
            - "null"
          description: ID of the bin in the location the stock is taken from.
        serial_batch:
          description: Serial or batch numbers picked for the line. Empty when none were picked.
          type: array
          items:
            type: object
            properties:
              serial_no:
                type:
                  - string
                  - "null"
                description: Serial number picked.
              batch_no:
                type:
                  - string
                  - "null"
                description: Batch number picked.
              qty:
                type: number
                description: Quantity taken from this serial or batch number.
              expired_date:
                type:
                  - string
                  - "null"
                format: date-time
                description: Expiry date recorded for the serial or batch number in stock. `null` when none is recorded.
        is_free_gift:
          type: boolean
          description: Whether the line is a free gift.
        promotion_id:
          type:
            - integer
            - "null"
          description: ID of the promotion the line belongs to. `null` when none.
    Invoice:
      type: object
      properties:
        invoice_id:
          type: integer
          description: ID of the invoice.
        invoice_no:
          type: string
          description: Invoice number, generated by Jubelio when the invoice is created.
        contact_id:
          type: integer
          description: ID of the customer contact. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Customer name as stored on the invoice.
        buyer_id:
          type:
            - integer
            - "null"
          description: ID of the buyer contact. For an invoice made from a sales order, the buyer stored on the invoice; otherwise the same as `contact_id`.
        buyer_name:
          type:
            - string
            - "null"
          description: Name of the buyer. For an invoice made from a sales order, the buyer name stored on the invoice; otherwise the same as `customer_name`.
        ref_no:
          type:
            - string
            - "null"
          description: Reference number. When it is a sales order number, the invoice was made from that sales order. Empty when none was given.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the invoice.
        due_date:
          type: string
          format: date-time
          description: Date payment is due.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the stock goes out from. See `GET /locations`.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location the stock goes out from.
        channel_id:
          type:
            - integer
            - "null"
          description: ID of the sales channel. For an invoice made from a sales order, the sales order's channel. `null` when the invoice has no channel.
        channel_name:
          type:
            - string
            - "null"
          description: Name of the sales channel.
        store_id:
          type:
            - integer
            - "null"
          description: ID of the store the sale belongs to. For an invoice made from a sales order, the sales order's store. `null` when the invoice has no store.
        store_name:
          type:
            - string
            - "null"
          description: Name of the store.
        salesmen_id:
          type:
            - integer
            - "null"
          description: ID of the salesperson credited with the invoice. `null` when none is set.
        salesmen_name:
          type:
            - string
            - "null"
          description: Name of the salesperson.
        is_tax_included:
          type: boolean
          description: Whether line prices include tax. When `true`, tax is taken out of the line amount; otherwise it is added on top.
        note:
          type:
            - string
            - "null"
          description: Free text note on the invoice.
        sub_total:
          type: number
          description: Sum of line gross (price x qty).
        total_disc:
          type: number
          description: Sum of the lines' `disc_amount`. Does not include `add_disc`.
        add_disc:
          type: number
          description: Invoice-level discount, spread over the lines in proportion to their gross amount (`price` x `qty`).
        total_tax:
          type: number
          description: Sum of the lines' `tax_amount`.
        shipping_cost:
          type: number
          description: Shipping cost, added to `grand_total`.
        shipping_cost_discount:
          type: number
          description: Discount on the shipping cost, subtracted from `grand_total`.
        insurance_cost:
          type: number
          description: Insurance cost, added to `grand_total`.
        service_fee:
          type:
            - number
            - "null"
          description: Service fee, subtracted from `grand_total`. `null` when not set.
        order_processing_fee:
          type:
            - number
            - "null"
          description: Order processing fee, subtracted from `grand_total`. `null` when not set.
        add_fee:
          type:
            - number
            - "null"
          description: Additional fee, added to `grand_total`. `null` when not set.
        cod_fee:
          type:
            - number
            - "null"
          description: Cash on delivery fee. `cod_fee` minus `cod_fee_discount` is added to `grand_total`, never below 0. `null` when not set.
        cod_fee_discount:
          type:
            - number
            - "null"
          description: Discount on `cod_fee`. `null` when not set.
        loyalty_discount:
          type:
            - number
            - "null"
          description: Loyalty discount, subtracted from `grand_total`. `null` when not set.
        add_cost:
          type:
            - number
            - "null"
          description: Sum of `add_costs[].amount`. `null` when there are no additional costs.
        grand_total:
          type: number
          description: Total amount of the invoice, calculated as described in `POST /finance/invoices`.
        paid_amount:
          type: number
          description: "Amount settled on the invoice so far: customer payments, sales returns settled against it, and down payments applied to it."
        tags:
          description: Tags attached to the invoice.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the invoice, as links.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: Name of the file.
              url:
                type: string
                description: Link to the file.
        add_costs:
          description: Additional costs on the invoice. Their sum is `add_cost`.
          type: array
          items:
            type: object
            properties:
              add_cost_setting_id:
                type: integer
                description: ID of the additional cost setting.
              cost_name:
                type: string
                description: Name of the additional cost, from its setting.
              account_id:
                type: integer
                description: ID of the account the cost is booked to, taken from the additional cost setting. See `GET /finance/accounts`.
              amount:
                type: number
                description: Amount of the cost.
              description:
                type:
                  - string
                  - "null"
                description: Note for the cost.
        lines:
          description: Invoice lines.
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        created_at:
          type: string
          format: date-time
          description: Time the invoice was created.
        last_modified:
          type: string
          format: date-time
          description: Time the invoice was last changed.
    InvoiceCogs:
      type: object
      properties:
        invoice_id:
          type: integer
          description: ID of the invoice.
        invoice_no:
          type: string
          description: Invoice number.
        total_cogs:
          type: number
          description: "Cost of goods sold of the whole invoice: sum of `lines[].total_cogs`, rounded to 4 decimals."
        lines:
          description: Cost of goods sold per invoice line.
          type: array
          items:
            type: object
            properties:
              invoice_detail_id:
                type: integer
                description: ID of the invoice line, the same as `lines[].invoice_detail_id` in `GET /finance/invoices/{id}`.
              item_id:
                type: integer
                description: ID of the item (SKU), the same as `sku_id` in `GET /catalog/products`.
              item_code:
                type: string
                description: SKU code of the item.
              qty:
                type: number
                description: Quantity sold, in `unit`. `price` is per `unit`. Copied from the invoice line.
              unit_cogs:
                type: number
                description: Average cost per unit when the invoice was created.
              total_cogs:
                type: number
                description: "Cost of goods sold of the line: `qty` x `unit_cogs`, rounded to 4 decimals."
    InvoiceCreate:
      type: object
      required:
        - contact_id
        - due_date
        - location_id
        - lines
      properties:
        contact_id:
          type: integer
          description: ID of the customer contact. Required. See `GET /finance/customer-contacts`. A contact that is not a customer returns `customer_not_found`.
        buyer_id:
          type: integer
          description: Contact ID of the buyer, when it is not the customer in `contact_id`. Optional. It must be a customer contact (`customer_not_found`). It is stored on the invoice, but `GET /finance/invoices/{id}` reports the customer as the buyer for every invoice not made from a sales order, so this value is not returned.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the invoice. Defaults to the time of the request.
        due_date:
          type: string
          format: date-time
          description: Date payment is due. Required. While an amount is still unpaid, the invoice is `overdue` from this date on.
        location_id:
          type: integer
          description: ID of the location the stock goes out from. Required. See `GET /locations`. An unknown ID returns `location_not_found`.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Free text note on the invoice. HTML tags are removed, and an empty string is stored as `null`.
        ref_no:
          type:
            - string
            - "null"
          maxLength: 100
          description: Free reference number. Must not be a sales order number.
        salesmen_id:
          type: integer
          minimum: 1
          description: ID of the salesperson credited with the invoice. An unknown ID returns `salesmen_not_found`.
        channel_id:
          type: integer
          minimum: 1
          description: ID of the sales channel. When `store_id` is sent, the channel is taken from the store and `channel_id`, if also sent, must match it (`store_channel_mismatch`). An unknown ID returns `channel_not_found`.
        store_id:
          type: integer
          description: ID of the store the sale belongs to. The invoice channel is taken from the store; if `channel_id` is also sent it must be the store's channel (`store_channel_mismatch`). An unknown ID returns `store_not_found`.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of the tags to attach to the invoice. Defaults to none. Each ID must exist (`tag_not_found`) and must not repeat.
        attachments:
          description: Files to attach to the invoice, given as links. Defaults to none. Stored in the order sent.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: Name of the file. Required.
              url:
                type: string
                maxLength: 1000
                description: Link to the file. Required. Stored as sent.
        add_disc:
          type: number
          minimum: 0
          default: 0
          description: Invoice-level discount, spread over the lines.
        shipping_cost:
          type: number
          minimum: 0
          default: 0
          description: Shipping cost, added to `grand_total`. Defaults to `0`.
        shipping_cost_discount:
          type: number
          minimum: 0
          default: 0
          description: Discount on the shipping cost, subtracted from `grand_total`. Defaults to `0`.
        insurance_cost:
          type: number
          minimum: 0
          default: 0
          description: Insurance cost, added to `grand_total`. Defaults to `0`.
        service_fee:
          type: number
          minimum: 0
          default: 0
          description: Service fee, subtracted from `grand_total`. Defaults to `0`.
        order_processing_fee:
          type: number
          minimum: 0
          default: 0
          description: Order processing fee, subtracted from `grand_total`. Defaults to `0`.
        add_fee:
          type: number
          minimum: 0
          default: 0
          description: Additional fee, added to `grand_total`. Defaults to `0`.
        cod_fee:
          type: number
          minimum: 0
          default: 0
          description: Cash on delivery fee. Defaults to `0`. `cod_fee` minus `cod_fee_discount` is added to `grand_total`, never below 0. Only allowed when the invoice has a channel (`channel_id` or `store_id`) that is internal, webstore, Jubelio Store, or a channel with no connected store; otherwise `cod_not_allowed`.
        cod_fee_discount:
          type: number
          minimum: 0
          default: 0
          description: Discount on `cod_fee`. Defaults to `0`. `cod_fee` minus `cod_fee_discount` is added to `grand_total`, never below 0. Same channel rule as `cod_fee`.
        loyalty_discount:
          type: number
          minimum: 0
          default: 0
          description: Loyalty discount, subtracted from `grand_total`. Defaults to `0`.
        add_costs:
          description: Additional costs on the invoice. Defaults to none. Their sum is added to `grand_total` and returned as `add_cost`.
          type: array
          items:
            type: object
            required:
              - add_cost_setting_id
              - amount
            properties:
              add_cost_setting_id:
                type: integer
                minimum: 1
                description: ID of the additional cost setting, which sets the cost name and the account the cost is booked to. Required. An unknown ID returns `add_cost_setting_not_found`.
              amount:
                type: number
                minimum: 0
                description: Amount of the cost. Required.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Note for the cost. HTML tags are removed, and an empty string is stored as `null`.
        lines:
          description: Invoice lines. At least one is required.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item_id
              - qty
              - price
            properties:
              item_id:
                type: integer
                minimum: 1
                description: ID of the item (SKU) sold, the same as `sku_id` in `GET /catalog/products`. Required. The line takes the item's selling unit, sales account and, by default, its sales tax. An unknown ID returns `item_not_found`.
              qty:
                type: number
                minimum: 1
                description: Quantity sold, in the item's selling unit. Required.
              price:
                type: number
                minimum: 0
                description: Unit price. Required. Includes tax when `is_tax_included` is `true`.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Line discount in percent. Not together with `disc_amount`.
              disc_amount:
                type: number
                minimum: 0
                description: Line discount as a fixed amount. Not together with `disc`.
              tax_id:
                type: integer
                description: ID of the tax for the line. See `GET /finance/taxes`; built-in taxes have negative IDs. Defaults to the item's sales tax, or No Tax (`1`) when the item has none. An unknown ID returns `tax_not_found`.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the item name when omitted or empty. HTML tags are removed.
              bin_id:
                type: integer
                description: Bin in `location_id`. Defaults to the location's default bin.
              serial_batch:
                type: array
                description: Serial or batch numbers picked for this line. Defaults to none. When the merchant's setting requires serial or batch numbers, lines of items that use them must send this, or the invoice is rejected (`request_rejected`).
                items:
                  type: object
                  required:
                    - qty
                  properties:
                    serial_no:
                      type: string
                      maxLength: 100
                      description: Serial number picked. Send `serial_no`, `batch_no` or both.
                    batch_no:
                      type: string
                      maxLength: 100
                      description: Batch number picked. Send `serial_no`, `batch_no` or both.
                    qty:
                      type: number
                      minimum: 1
                      description: Quantity taken from this serial or batch number. Required.
              is_free_gift:
                type: boolean
                default: false
                description: Whether the line is a free gift. Defaults to `false`.
              promotion_id:
                type: integer
                minimum: 1
                description: ID of the promotion the line belongs to. An unknown ID returns `promotion_not_found`.
    SalesReturnSummary:
      type: object
      properties:
        sales_return_id:
          type: integer
          description: ID of the sales return. Use it with `GET /finance/sales-returns/{id}`.
        return_no:
          type: string
          example: SR-000000123
          description: Return number, assigned automatically when the return is created.
        contact_id:
          type: integer
          description: ID of the customer contact. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Name of the customer.
        invoice_no:
          type:
            - string
            - "null"
          description: Number of the invoice the return was made for; `null` for a return without an invoice.
        ref_no:
          type:
            - string
            - "null"
          description: Free reference number of the return; `null` when none was entered.
        transaction_date:
          type: string
          format: date-time
          description: Date and time of the return.
        grand_total:
          type: number
          description: Total value of the return, as a positive amount. See `grand_total` in `GET /finance/sales-returns/{id}` for the formula.
        due:
          type: number
          description: Amount not yet refunded or offset against an invoice.
        status:
          type: string
          enum:
            - paid
            - unpaid
            - overdue
          description: "Settlement status. `paid`: `due` is 0, so the return is fully refunded or offset against an invoice. `unpaid`: an amount is still open. `overdue`: an amount is still open and the due date is today or earlier."
        created_at:
          type: string
          format: date-time
          description: When the return was created.
        last_modified:
          type: string
          format: date-time
          description: When the return was last changed.
    SalesReturnLine:
      type: object
      properties:
        sales_return_detail_id:
          type: integer
          description: ID of the return line.
        invoice_detail_id:
          type:
            - integer
            - "null"
          description: ID of the invoice line this line returns; `null` for a return without an invoice.
        item_id:
          type: integer
          description: ID of the returned item.
        item_code:
          type: string
          description: Code of the item.
        item_name:
          type: string
          description: Name of the item.
        description:
          type:
            - string
            - "null"
          description: Description of the line. Returns created through this API default it to the invoice line description, or to the item name when there is no invoice.
        unit:
          type:
            - string
            - "null"
          description: Unit of `qty`. Returns created through this API use the item's sales unit.
        qty:
          type: number
          description: Quantity returned, in `unit`. `price` is per `unit`.
        price:
          type: number
          description: Unit price. With an invoice, copied from the invoice line.
        disc:
          type: number
          description: Line discount, percent.
        disc_amount:
          type: number
          description: "Line discount as an amount: `qty` x `price` x `disc` / 100."
        tax_id:
          type:
            - integer
            - "null"
          description: ID of the tax on the line; `null` when none is set. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax in `tax_id`.
        tax_rate:
          type:
            - number
            - "null"
          description: Rate of the tax in `tax_id`, in percent.
        tax_amount:
          type: number
          description: Tax on the line `amount`. When `is_tax_included` is true, this is the tax part inside `amount`; otherwise `amount` x `tax_rate` / 100.
        amount:
          type: number
          description: Line amount after the line discount and its share of `add_disc`. Includes tax when `is_tax_included` is true.
        sales_account_id:
          type:
            - integer
            - "null"
          description: "ID of the account the returned sales value is booked to. With an invoice: the item's sales return account, else the default sales return account in the settings (for consignment items, the invoice line's sales account). Without an invoice: the item's sales account. See `GET /finance/accounts`."
        serial_no:
          type:
            - string
            - "null"
          description: Serial number of the returned unit; `null` when none.
        batch_no:
          type:
            - string
            - "null"
          description: Batch number of the returned stock; `null` when none.
        expired_date:
          type:
            - string
            - "null"
          format: date-time
          description: Expiry date of the batch in `batch_no`; `null` when none.
    SalesReturn:
      type: object
      properties:
        sales_return_id:
          type: integer
          description: ID of the sales return.
        return_no:
          type: string
          description: Return number, assigned automatically when the return is created.
        contact_id:
          type: integer
          description: ID of the customer contact. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Customer name stored on the return.
        invoice_id:
          type:
            - integer
            - "null"
          description: ID of the invoice the return was made for; `null` for a return without an invoice. See `GET /finance/invoices/{id}`.
        invoice_no:
          type:
            - string
            - "null"
          description: Number of the invoice the return was made for; `null` for a return without an invoice.
        ref_no:
          type:
            - string
            - "null"
          description: Free reference number of the return; `null` when none was entered.
        transaction_date:
          type: string
          format: date-time
          description: Date and time of the return.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the returned stock goes back to. See `GET /locations`.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location in `location_id`.
        channel_id:
          type:
            - integer
            - "null"
          description: ID of the sales channel. Taken from the return, else from its invoice, else from the invoice's sales order; `null` when none of them has one.
        channel_name:
          type:
            - string
            - "null"
          description: Name of the sales channel in `channel_id`.
        store_id:
          type:
            - integer
            - "null"
          description: ID of the store. Taken from the return, else from its invoice, else from the invoice's sales order; `null` when none of them has one.
        store_name:
          type:
            - string
            - "null"
          description: Name of the store in `store_id`.
        is_tax_included:
          type: boolean
          description: Whether line prices already include tax. With an invoice, copied from the invoice.
        is_return_online:
          type: boolean
          description: "`true` for a return Jubelio created from a returned sales order (shown as an online return), `false` for a manual return. Returns created through this API are always `false`."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the return; `null` when none was entered.
        sub_total:
          type: number
          description: Sum of line gross (`price` x `qty`), before discounts.
        total_disc:
          type: number
          description: Sum of the line `disc_amount` values.
        add_disc:
          type:
            - number
            - "null"
          description: Return-level additional discount. It is spread over the lines in proportion to their value and is already deducted from line `amount`.
        total_tax:
          type: number
          description: "Total tax: sum of the line `tax_amount` values plus `shipping_tax`."
        shipping_tax:
          type:
            - number
            - "null"
          description: Tax on shipping, included in `total_tax`. Returns created through this API copy it from the invoice, or set 0 when there is no invoice.
        add_fee:
          type:
            - number
            - "null"
          description: Additional fee, added to `grand_total`.
        service_fee:
          type:
            - number
            - "null"
          description: Service fee, subtracted from `grand_total`.
        order_processing_fee:
          type:
            - number
            - "null"
          description: Order processing fee, subtracted from `grand_total`.
        loyalty_discount:
          type:
            - number
            - "null"
          description: Loyalty discount, subtracted from `grand_total`.
        add_cost:
          type:
            - number
            - "null"
          description: Sum of the `add_costs` amounts, added to `grand_total`. `0` or `null` when the return has no additional costs.
        grand_total:
          type: number
          description: "Total value of the return: amount before tax + `total_tax` + `add_fee` - `service_fee` - `order_processing_fee` + `add_cost` - `loyalty_discount`."
        is_settled:
          type: boolean
          description: Fully refunded or offset against an invoice.
        tags:
          description: Tags on the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: File name of the attachment.
              url:
                type: string
                description: URL of the attached file.
        add_costs:
          description: Additional costs on the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              add_cost_setting_id:
                type: integer
                description: ID of the additional cost setting the cost belongs to.
              cost_name:
                type: string
                description: Name of the additional cost setting.
              account_id:
                type: integer
                description: ID of the account the cost is booked to, taken from the additional cost setting. See `GET /finance/accounts`.
              amount:
                type: number
                description: Amount of the additional cost.
              description:
                type:
                  - string
                  - "null"
                description: Free-text description of the cost; `null` when none was entered.
        lines:
          description: Returned items, one entry per line.
          type: array
          items:
            $ref: "#/components/schemas/SalesReturnLine"
        created_at:
          type: string
          format: date-time
          description: When the return was created.
        last_modified:
          type: string
          format: date-time
          description: When the return was last changed.
    SalesReturnCreate:
      type: object
      required:
        - lines
      description: |
        Fields marked "without invoice only" are rejected when `invoice_id`
        is sent; they come from the invoice instead.
      properties:
        invoice_id:
          type: integer
          minimum: 1
          description: Invoice being returned. Omit for a return without an invoice.
        contact_id:
          type: integer
          description: ID of the customer contact. See `GET /finance/customer-contacts`. Required without `invoice_id`; not allowed with it, where the invoice's customer is used.
        location_id:
          type: integer
          description: Location the stock returns to. Required without invoice; defaults to the invoice location.
        transaction_date:
          type: string
          format: date-time
          description: Defaults to now. Not before the invoice date.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax. Without invoice only; with `invoice_id` the invoice's setting is used. Defaults to `false`.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Free-text note on the return. Optional.
        ref_no:
          type:
            - string
            - "null"
          maxLength: 100
          description: Free reference number of the return. Optional.
        channel_id:
          type: integer
          minimum: 1
          description: ID of the sales channel. Without invoice only; with `invoice_id` the invoice's channel is used. When `store_id` is sent, the channel is taken from the store, and a different `channel_id` is rejected with `store_channel_mismatch`.
        store_id:
          type: integer
          description: ID of the store. Without invoice only; with `invoice_id` the invoice's store is used. The return's channel is taken from this store.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of tags to put on the return. Defaults to none. An unknown id is rejected with `tag_not_found`.
        attachments:
          description: Files to attach to the return, given as links. Defaults to none.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: File name of the attachment. Required.
              url:
                type: string
                maxLength: 1000
                description: URL of the file. Required. The file is not uploaded; only the link is stored.
        add_disc:
          type: number
          minimum: 0
          default: 0
          description: Return-level discount, spread over the lines in proportion to their value. Without invoice only, and only accepted when the sales return setting includes other fees (otherwise `return_fees_disabled`). With `invoice_id`, the invoice's additional discount prorated by the returned value is used when that setting is on. Defaults to 0.
        add_fee:
          type: number
          minimum: 0
          default: 0
          description: Additional fee, added to `grand_total`. Without invoice only, and only accepted when the sales return setting includes other fees (otherwise `return_fees_disabled`). With `invoice_id`, the invoice's `add_fee` is used when that setting is on. Defaults to 0.
        service_fee:
          type: number
          minimum: 0
          default: 0
          description: Service fee, subtracted from `grand_total`. Without invoice only, and only accepted when the sales return setting includes other fees (otherwise `return_fees_disabled`). With `invoice_id`, the invoice's `service_fee` is used when that setting is on. Defaults to 0.
        order_processing_fee:
          type: number
          minimum: 0
          default: 0
          description: Order processing fee, subtracted from `grand_total`. Without invoice only, and only accepted when the sales return setting includes other fees (otherwise `return_fees_disabled`). With `invoice_id`, the invoice's fee is used only when that setting is on and every invoiced unit is returned. Defaults to 0.
        loyalty_discount:
          type: number
          minimum: 0
          default: 0
          description: Loyalty discount, subtracted from `grand_total`. Without invoice only. With `invoice_id`, the invoice's loyalty discount prorated by the returned value is used. Defaults to 0.
        add_costs:
          type: array
          description: Only when the return setting allows additional costs on sales returns. With `invoice_id`, the total must not exceed the invoice additional cost.
          items:
            type: object
            required:
              - add_cost_setting_id
              - amount
            properties:
              add_cost_setting_id:
                type: integer
                minimum: 1
                description: ID of the additional cost setting. Required. The cost is booked to the setting's account. An unknown id is rejected with `add_cost_setting_not_found`.
              amount:
                type: number
                minimum: 0
                description: Amount of the additional cost, added to `grand_total`. Required.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Free-text description of the cost. Optional.
        auto_placement:
          type: boolean
          default: false
          description: Also put the returned stock away to its bins.
        lines:
          description: Items to return, at least one. With `invoice_id`, each line takes `invoice_detail_id` and `qty` (plus optional `description`, `serial_no`, `batch_no`, `expired_date`); `price`, `disc`, `disc_amount` and `tax_id` are rejected with `line_invalid`. Without `invoice_id`, each line takes `item_id`, `qty` and `price`.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - qty
            description: "With `invoice_id`: `invoice_detail_id` and `qty` only. Without: `item_id`, `qty` and `price`."
            properties:
              invoice_detail_id:
                type: integer
                minimum: 1
                description: ID of the invoice line being returned, from `lines[].invoice_detail_id` of `GET /finance/invoices/{id}`. Required with `invoice_id`. Send `invoice_detail_id` or `item_id`, not both. Each invoice line can appear only once.
              item_id:
                type: integer
                minimum: 1
                description: ID of the item being returned. Required without `invoice_id`, and then `price` is required too. Send `item_id` or `invoice_detail_id`, not both.
              qty:
                type: number
                minimum: 1
                description: Quantity to return. Required. With `invoice_id`, it must not exceed what is left to return on the invoice line, otherwise `qty_exceeds_invoice`.
              price:
                type: number
                minimum: 0
                description: Unit price. Required with `item_id`. Not allowed with `invoice_id`, where the invoice line price is used.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Percent. Not together with `disc_amount`.
              disc_amount:
                type: number
                minimum: 0
                description: Line discount as a fixed amount. Without invoice only. Send `disc` or `disc_amount`, not both.
              tax_id:
                type: integer
                description: ID of the tax. See `GET /finance/taxes`. Without invoice only; with `invoice_id` the invoice line tax is used. Defaults to the item's sales tax, or no tax (id `1`) when the item has none. Built-in taxes have negative ids.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the invoice line description, or to the item name without an invoice.
              serial_no:
                type: string
                maxLength: 100
                description: Serial number of the returned unit. Optional.
              batch_no:
                type: string
                maxLength: 100
                description: Requires `expired_date`.
              expired_date:
                type: string
                format: date-time
                description: Expiry date of the batch in `batch_no`. Required when `batch_no` is sent.
    BillSummary:
      type: object
      properties:
        bill_id:
          type: integer
          description: ID of the bill. Use it with `GET /finance/bills/{id}`.
        bill_no:
          type: string
          example: BIL-000001234
          description: Bill number.
        contact_id:
          type: integer
          description: ID of the supplier the bill is from. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, as saved on the bill.
        ref_no:
          type:
            - string
            - "null"
          description: Supplier's invoice or reference number. `null` when none was entered.
        purchaseorder_no:
          type:
            - string
            - "null"
          description: Number of the purchase order the bill was made from. `null` when the bill is not from a purchase order.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the stock came into. See `GET /locations`. `null` for an opening-balance bill, which has no location.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location the stock came into. `null` when the bill has no location.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the bill.
        due_date:
          type: string
          format: date-time
          description: Date the bill is due to be paid. For bills created through the API it is `transaction_date` plus the payment term in days.
        grand_total:
          type: number
          description: "Total of the bill: line amounts after discount and before tax, plus tax, plus additional costs."
        due:
          type: number
          description: "Amount still to be paid: `grand_total` minus payments and purchase order down payments used on the bill. 0 or less means the bill is paid."
        status:
          type: string
          enum:
            - paid
            - unpaid
            - overdue
          description: "Payment status, worked out from `due` and `due_date`. `paid`: nothing is left to pay (`due` is 0 or less). `overdue`: an amount is still due and today is on or after `due_date`. `unpaid`: an amount is still due and `due_date` has not been reached yet."
    BillLine:
      type: object
      properties:
        bill_detail_id:
          type: integer
          description: ID of the bill line. Purchase return lines refer to it in `bill_detail_id`.
        purchaseorder_detail_id:
          type:
            - integer
            - "null"
          description: ID of the purchase order line this bill line was made from. `null` when the bill is not from a purchase order.
        item_id:
          type: integer
          description: ID of the item (SKU), the same as `sku_id` in `GET /catalog/products`.
        item_code:
          type: string
          description: Code (SKU) of the item.
        item_name:
          type: string
          description: Name of the item.
        description:
          type:
            - string
            - "null"
          description: Text of the line. For bills created through the API, the `description` that was sent, or else the item name.
        unit:
          type:
            - string
            - "null"
          description: Unit the item is received in. For bills created through the API, the item's purchase unit.
        qty:
          type: number
          description: Quantity received, in `unit`. `price` is per `unit`.
        price:
          type: number
          description: Unit price before discount. Includes tax when the bill's `is_tax_included` is `true`.
        disc:
          type: number
          description: Line discount, in percent.
        disc_amount:
          type: number
          description: "Line discount as an amount. Matches `disc`: `qty` x `price` x `disc` / 100."
        tax_id:
          type:
            - integer
            - "null"
          description: ID of the tax on the line. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax on the line.
        tax_rate:
          type:
            - number
            - "null"
          description: Rate of the tax on the line, in percent.
        tax_amount:
          type: number
          description: Tax on the line. When `is_tax_included` is `true`, the part of `amount` that is tax; otherwise `amount` x `tax_rate` / 100.
        amount:
          type: number
          description: "Line amount: `qty` x `price` minus `disc_amount`. It includes tax only when the bill's `is_tax_included` is `true`."
        account_id:
          type:
            - integer
            - "null"
          description: Inventory or purchase account of the line.
        bin_id:
          type:
            - integer
            - "null"
          description: ID of the bin in the bill location that the line is linked to. `null` when no bin is set.
        serial_numbers:
          type: array
          items:
            type: string
          description: Serial numbers received on the line, one per unit. Empty when the item does not track serial numbers.
        batches:
          description: Batches received on the line. Empty when the item does not track batches.
          type: array
          items:
            type: object
            properties:
              batch_no:
                type: string
                description: Batch number.
              expired_date:
                type:
                  - string
                  - "null"
                format: date-time
                description: Expiry date of the batch. `null` when the batch has none.
              qty:
                type: number
                description: Quantity received in this batch.
    Bill:
      type: object
      properties:
        bill_id:
          type: integer
          description: ID of the bill.
        bill_no:
          type: string
          description: Bill number.
        contact_id:
          type: integer
          description: ID of the supplier the bill is from. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, as saved on the bill.
        ref_no:
          type:
            - string
            - "null"
          description: Supplier's invoice or reference number. `null` when none was entered.
        purchaseorder_id:
          type:
            - integer
            - "null"
          description: ID of the purchase order the bill was made from. See `GET /finance/purchase-orders/{id}`. `null` when the bill is not from a purchase order.
        purchaseorder_no:
          type:
            - string
            - "null"
          description: Number of the purchase order the bill was made from. `null` when the bill is not from a purchase order.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the bill.
        due_date:
          type: string
          format: date-time
          description: Date the bill is due to be paid. For bills created through the API it is `transaction_date` plus `payment_term` days.
        payment_term:
          type:
            - integer
            - "null"
          description: Days until due.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the stock came into. See `GET /locations`. `null` for an opening-balance bill, which has no location.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location the stock came into. `null` when the bill has no location.
        is_tax_included:
          type: boolean
          description: Whether the line prices already include tax.
        note:
          type:
            - string
            - "null"
          description: Note on the bill. `null` when empty.
        sub_total:
          type: number
          description: Sum of line gross (price x qty).
        total_disc:
          type: number
          description: Sum of the line discounts (`disc_amount`).
        total_tax:
          type: number
          description: Sum of the line taxes (`tax_amount`).
        add_cost:
          type:
            - number
            - "null"
          description: Sum of the additional costs in `add_costs`, included in `grand_total`. Can be `null` when the bill has no additional costs.
        grand_total:
          type: number
          description: "Total of the bill: line amounts after discount and before tax, plus tax, plus additional costs (`add_cost`)."
        paid_amount:
          type: number
          description: "Amount already paid: payments recorded against the bill plus purchase order down payments used on it."
        tags:
          description: Tags on the bill.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the bill.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: Name of the file.
              url:
                type: string
                description: URL where the file can be downloaded.
        add_costs:
          description: Additional costs on the bill. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              add_cost_setting_id:
                type: integer
                description: ID of the additional cost setting in Jubelio.
              cost_name:
                type: string
                description: Name of the additional cost setting.
              account_id:
                type: integer
                description: ID of the account the cost is booked to, taken from the additional cost setting. See `GET /finance/accounts/{id}`.
              amount:
                type: number
                description: Amount of the additional cost.
              description:
                type:
                  - string
                  - "null"
                description: Note for the additional cost. `null` when empty.
        lines:
          description: Items received on the bill.
          type: array
          items:
            $ref: "#/components/schemas/BillLine"
        created_at:
          type: string
          format: date-time
          description: When the bill was created in Jubelio.
        last_modified:
          type: string
          format: date-time
          description: When the bill was last changed.
    BillCreate:
      type: object
      required:
        - contact_id
        - location_id
        - lines
      properties:
        contact_id:
          type: integer
          description: ID of the supplier the bill is from. See `GET /finance/supplier-contacts`. Required; an unknown supplier fails with `supplier_not_found`.
        transaction_date:
          type: string
          format: date-time
          description: Defaults to now.
        payment_term:
          type: integer
          minimum: 1
          description: Days from `transaction_date` until the bill is due; `due_date` is set from it. Optional; defaults to the supplier's payment term. When that is 0 days (a cash bill), the request fails with `cash_bill_not_supported`, so send a term of at least 1 day.
        location_id:
          type: integer
          description: ID of the location the stock comes into. See `GET /locations`. Required.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Note on the bill. Optional. HTML tags are removed.
        ref_no:
          type:
            - string
            - "null"
          maxLength: 100
          description: Supplier's invoice or reference number.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of the tags to put on the bill. Optional. Every ID must exist, otherwise the request fails with `tag_not_found`.
        attachments:
          description: Files to attach to the bill, given by URL. Optional.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: Name of the file as shown in Jubelio. Required.
              url:
                type: string
                maxLength: 1000
                description: URL where the file can be downloaded. Required.
        add_costs:
          description: Additional costs on the bill. Optional. Their amounts are added to `grand_total`.
          type: array
          items:
            type: object
            required:
              - add_cost_setting_id
              - amount
            properties:
              add_cost_setting_id:
                type: integer
                minimum: 1
                description: ID of the additional cost setting in Jubelio. The cost is booked to the account of that setting. Required; an unknown ID fails with `add_cost_setting_not_found`.
              amount:
                type: number
                minimum: 0
                description: Amount of the additional cost. Required.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Note for the additional cost. Optional.
        auto_placement:
          type: boolean
          default: false
          description: Also put the received stock away to its bins.
        lines:
          description: Items received on the bill. At least one line is required.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item_id
              - qty
              - price
            properties:
              item_id:
                type: integer
                minimum: 1
                description: ID of the item (SKU) received, the same as `sku_id` in `GET /catalog/products`. Required. Consignment items are rejected with `item_is_consignment`.
              qty:
                type: integer
                minimum: 1
                description: Quantity received, as a whole number. Required. The line unit is the item's purchase unit.
              price:
                type: number
                minimum: 0
                description: Unit price.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Percent. Not together with `disc_amount`.
              disc_amount:
                type: number
                minimum: 0
                description: Fixed amount. Not together with `disc`.
              tax_id:
                type: integer
                description: ID of the tax on the line. See `GET /finance/taxes`; built-in taxes have negative IDs. Optional; defaults to the item's purchase tax, or No Tax (ID 1) when the item has none.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the item name when omitted or empty. HTML tags are removed.
              serial_numbers:
                type: array
                description: Serial numbers received, one per unit, so their count must equal `qty` (`serial_qty_mismatch`). Only for items that track serial numbers (`serial_not_tracked`). Not together with `batches`. Optional; when neither is sent, Jubelio generates them for items that track them.
                items:
                  type: string
                  maxLength: 100
                uniqueItems: true
              batches:
                type: array
                description: Batches received; their quantities must add up to `qty` (`batch_qty_mismatch`). Only for items that track batches (`batch_not_tracked`). Not together with `serial_numbers`. Optional; when neither is sent, Jubelio generates them for items that track them.
                items:
                  type: object
                  required:
                    - batch_no
                    - expired_date
                    - qty
                  properties:
                    batch_no:
                      type: string
                      maxLength: 100
                      description: Batch number. Required.
                    expired_date:
                      type: string
                      format: date-time
                      description: Expiry date of the batch. Required.
                    qty:
                      type: integer
                      minimum: 1
                      description: Quantity received in this batch. Required. The quantities of all batches on the line must add up to the line `qty`, otherwise the request fails with `batch_qty_mismatch`.
    PurchaseReturnSummary:
      type: object
      properties:
        purchase_return_id:
          type: integer
          description: ID of the purchase return. Use it with `GET /finance/purchase-returns/{id}`.
        return_no:
          type: string
          example: PR-000000321
          description: Return number, assigned automatically when the return is created.
        contact_id:
          type: integer
          description: ID of the supplier contact. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier.
        bill_no:
          type:
            - string
            - "null"
          description: Number of the bill the return was made for; `null` for a return without a bill.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the returned stock left from. See `GET /locations`.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location in `location_id`.
        transaction_date:
          type: string
          format: date-time
          description: Date and time of the return.
        note:
          type:
            - string
            - "null"
          description: Free-text note on the return; `null` when none was entered.
        grand_total:
          type: number
          description: "Total value of the return, as a positive amount: amount before tax + `total_tax` + `add_cost`."
        due:
          type: number
          description: Amount not yet refunded or offset against a bill.
        status:
          type: string
          enum:
            - paid
            - unpaid
            - overdue
          description: "Settlement status. `paid`: nothing is left to refund or offset against a bill. `overdue`: an amount is still open and the return is dated today or earlier; a purchase return counts as due from its own transaction date, so every open return dated today or earlier is `overdue`. `unpaid`: an amount is still open and the return is dated in the future."
    PurchaseReturnLine:
      type: object
      properties:
        purchase_return_detail_id:
          type: integer
          description: ID of the return line.
        bill_detail_id:
          type:
            - integer
            - "null"
          description: ID of the bill line this line returns; `null` for a return without a bill.
        item_id:
          type: integer
          description: ID of the returned item.
        item_code:
          type: string
          description: Code of the item.
        item_name:
          type: string
          description: Name of the item.
        description:
          type:
            - string
            - "null"
          description: Description of the line. Returns created through this API default it to the bill line description, or to the item name when there is no bill.
        unit:
          type:
            - string
            - "null"
          description: Unit of `qty`. Returns created through this API use the bill line unit, or the item's purchase unit when there is no bill.
        qty:
          type: number
          description: Quantity returned, in `unit`. `price` is per `unit`.
        price:
          type: number
          description: Unit price. With a bill, copied from the bill line.
        disc:
          type: number
          description: Line discount, percent.
        disc_amount:
          type: number
          description: "Line discount as an amount: `qty` x `price` x `disc` / 100."
        tax_id:
          type:
            - integer
            - "null"
          description: ID of the tax on the line; `null` when none is set. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax in `tax_id`.
        tax_rate:
          type:
            - number
            - "null"
          description: Rate of the tax in `tax_id`, in percent.
        tax_amount:
          type: number
          description: Tax on the line `amount`. When `is_tax_included` is true, this is the tax part inside `amount`; otherwise `amount` x `tax_rate` / 100.
        amount:
          type: number
          description: "Line amount: `qty` x `price` minus `disc_amount`. Includes tax when `is_tax_included` is true."
        account_id:
          type:
            - integer
            - "null"
          description: "ID of the inventory account the line is booked to. With a bill: the bill line's account, else the item's inventory account. Without a bill: the item's inventory account. See `GET /finance/accounts`."
        bin_id:
          type:
            - integer
            - "null"
          description: ID of the bin the returned stock left from.
        serial_no:
          type:
            - string
            - "null"
          description: Serial number of the returned unit; `null` when none.
        batch_no:
          type:
            - string
            - "null"
          description: Batch number of the returned stock; `null` when none.
    PurchaseReturn:
      type: object
      properties:
        purchase_return_id:
          type: integer
          description: ID of the purchase return.
        return_no:
          type: string
          description: Return number, assigned automatically when the return is created.
        contact_id:
          type: integer
          description: ID of the supplier contact. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Supplier name stored on the return.
        bill_id:
          type:
            - integer
            - "null"
          description: ID of the bill the return was made for; `null` for a return without a bill. See `GET /finance/bills/{id}`.
        bill_no:
          type:
            - string
            - "null"
          description: Number of the bill the return was made for; `null` for a return without a bill.
        transaction_date:
          type: string
          format: date-time
          description: Date and time of the return.
        location_id:
          type:
            - integer
            - "null"
          description: ID of the location the returned stock left from. See `GET /locations`.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location in `location_id`.
        is_tax_included:
          type: boolean
          description: Whether line prices already include tax. With a bill, copied from the bill.
        note:
          type:
            - string
            - "null"
          description: Free-text note on the return; `null` when none was entered.
        sub_total:
          type: number
          description: Sum of line gross (`price` x `qty`), before discounts.
        total_disc:
          type: number
          description: Sum of the line `disc_amount` values.
        total_tax:
          type: number
          description: Sum of the line `tax_amount` values.
        add_cost:
          type:
            - number
            - "null"
          description: Sum of the `add_costs` amounts, added to `grand_total`. `0` or `null` when the return has no additional costs.
        grand_total:
          type: number
          description: "Total value of the return: amount before tax + `total_tax` + `add_cost`."
        tags:
          description: Tags on the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: File name of the attachment.
              url:
                type: string
                description: URL of the attached file.
        add_costs:
          description: Additional costs on the return; empty when there are none.
          type: array
          items:
            type: object
            properties:
              add_cost_setting_id:
                type: integer
                description: ID of the additional cost setting the cost belongs to.
              cost_name:
                type: string
                description: Name of the additional cost setting.
              account_id:
                type: integer
                description: ID of the account the cost is booked to, taken from the additional cost setting. See `GET /finance/accounts`.
              amount:
                type: number
                description: Amount of the additional cost.
              description:
                type:
                  - string
                  - "null"
                description: Free-text description of the cost; `null` when none was entered.
        lines:
          description: Returned items, one entry per line.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseReturnLine"
        created_at:
          type: string
          format: date-time
          description: When the return was created.
        last_modified:
          type: string
          format: date-time
          description: When the return was last changed.
    PurchaseReturnCreate:
      type: object
      required:
        - lines
      description: |
        Fields marked "without bill only" are rejected when `bill_id` is
        sent; they come from the bill instead.
      properties:
        bill_id:
          type: integer
          minimum: 1
          description: Bill being returned. Omit for a return without a bill.
        contact_id:
          type: integer
          description: ID of the supplier contact. See `GET /finance/supplier-contacts`. Required without `bill_id`; not allowed with it, where the bill's supplier is used.
        location_id:
          type: integer
          description: ID of the location the returned stock leaves from. See `GET /locations`. Required without `bill_id`; not allowed with it, where the bill's location is used.
        transaction_date:
          type: string
          format: date-time
          description: Defaults to now. Not before the bill date.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax. Without bill only; with `bill_id` the bill's setting is used. Defaults to `false`.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Free-text note on the return. Optional.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of tags to put on the return. Defaults to none. An unknown id is rejected with `tag_not_found`.
        attachments:
          description: Files to attach to the return, given as links. Defaults to none.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: File name of the attachment. Required.
              url:
                type: string
                maxLength: 1000
                description: URL of the file. Required. The file is not uploaded; only the link is stored.
        add_costs:
          type: array
          description: Only when the return setting allows it. With `bill_id`, the total must not exceed the bill additional cost.
          items:
            type: object
            required:
              - add_cost_setting_id
              - amount
            properties:
              add_cost_setting_id:
                type: integer
                minimum: 1
                description: ID of the additional cost setting. Required. The cost is booked to the setting's account. An unknown id is rejected with `add_cost_setting_not_found`.
              amount:
                type: number
                minimum: 0
                description: Amount of the additional cost, added to `grand_total`. Required.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Free-text description of the cost. Optional.
        lines:
          description: Items to return, at least one. With `bill_id`, each line takes `bill_detail_id` and `qty` (plus optional `description`, `bin_id`, `serial_no` or `batch_no`); `price`, `disc`, `disc_amount` and `tax_id` are rejected with `line_invalid`. Without `bill_id`, each line takes `item_id`, `qty` and `price`.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - qty
            description: "With `bill_id`: `bill_detail_id` and `qty` (optionally `bin_id`, serial or batch). Without: `item_id`, `qty` and `price`."
            properties:
              bill_detail_id:
                type: integer
                minimum: 1
                description: ID of the bill line being returned, from `lines[].bill_detail_id` of `GET /finance/bills/{id}`. Required with `bill_id`. Send `bill_detail_id` or `item_id`, not both. Each bill line can appear only once.
              item_id:
                type: integer
                minimum: 1
                description: ID of the item being returned. Required without `bill_id`, and then `price` is required too. Send `item_id` or `bill_detail_id`, not both.
              qty:
                type: number
                minimum: 1
                description: Quantity to return. Required. With `bill_id`, it must not exceed what is left to return on the bill line, otherwise `qty_exceeds_bill`.
              price:
                type: number
                minimum: 0
                description: Unit price. Required with `item_id`. Not allowed with `bill_id`, where the bill line price is used.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Percent. Not together with `disc_amount`.
              disc_amount:
                type: number
                minimum: 0
                description: Line discount as a fixed amount. Without bill only. Send `disc` or `disc_amount`, not both.
              tax_id:
                type: integer
                description: ID of the tax. See `GET /finance/taxes`. Without bill only; with `bill_id` the bill line tax is used. Defaults to the item's purchase tax, or no tax (id `1`) when the item has none. Built-in taxes have negative ids.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the bill line description, or to the item name without a bill.
              bin_id:
                type: integer
                description: ID of the bin the stock leaves from. Must be a bin in the return location, otherwise `bin_not_found`. Defaults to the bill line bin, or to the location's default bin.
              serial_no:
                type: string
                maxLength: 100
                description: Serial number of the returned unit. Optional. Send `serial_no` or `batch_no`, not both.
              batch_no:
                type: string
                maxLength: 100
                description: Batch number of the returned stock. Optional. Send `serial_no` or `batch_no`, not both.
    CustomerPaymentSummary:
      type: object
      properties:
        payment_id:
          type: integer
          description: ID of the customer payment.
        payment_no:
          type: string
          example: CPAY-000001234
          description: Payment number, given by Jubelio when the payment is saved. The prefix comes from the merchant's settings (`CPAY` by default).
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment.
        contact_id:
          type: integer
          description: Contact ID of the customer. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Name of the customer, copied from the contact when the payment was saved.
        account_id:
          type: integer
          description: ID of the account the money went to. See `GET /finance/accounts`.
        account_code:
          type: string
          description: Code of the account the money went to.
        account_name:
          type: string
          description: Code and name of the account the money went to, as `code - name`.
        amount:
          type: number
          description: "Cash received: the sum over all lines of `amount` plus additions minus deductions. The part covered by down payments is not included."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the payment. `null` when there is none.
        settlement_no:
          type:
            - string
            - "null"
          description: Number of the marketplace settlement that made this payment. `null` when the payment was not made by a settlement.
        cheque_number:
          type:
            - string
            - "null"
          description: Number of the cheque. `null` when the payment is not a cheque.
        cheque_status:
          type:
            - string
            - "null"
          enum:
            - active
            - cancelled
            - null
          description: "`active` for a cheque that is in force, `cancelled` after the cheque was cancelled in Jubelio. `null` when the payment is not a cheque."
        created_at:
          type: string
          format: date-time
          description: When the payment was created in Jubelio.
    CustomerPaymentAdjustment:
      type: object
      properties:
        type:
          type: string
          enum:
            - addition
            - deduction
          description: "`addition` adds `amount` to the cash received for the line, `deduction` subtracts it."
        account_id:
          type: integer
          description: ID of the account the adjustment is booked to. See `GET /finance/accounts`.
        account_code:
          type: string
          description: Code of the account the adjustment is booked to.
        account_name:
          type: string
          description: Name of the account the adjustment is booked to, without the code.
        amount:
          type: number
          description: Amount of the adjustment. `type` says whether it is added or subtracted.
        description:
          type:
            - string
            - "null"
          description: Free-text description of the adjustment. `null` when empty, which is always the case for automatic adjustments.
        is_automatic:
          type: boolean
          description: Added by Jubelio (income tax or COD fee).
    CustomerPaymentLine:
      type: object
      properties:
        payment_detail_id:
          type: integer
          description: ID of the payment line.
        invoice_id:
          type: integer
          description: ID of the invoice paid on this line. See `GET /finance/invoices`.
        invoice_no:
          type: string
          description: Number of the invoice.
        ref_no:
          type:
            - string
            - "null"
          description: Number of the sales order the invoice was made from, copied from the invoice. `null` when there is none.
        invoice_date:
          type: string
          format: date-time
          description: Transaction date of the invoice.
        invoice_grand_total:
          type: number
          description: Grand total of the invoice.
        invoice_due:
          type: number
          description: Amount still owed on the invoice now, after all its payments so far, not as of this payment.
        amount:
          type: number
          description: Part of the invoice paid in cash or bank by this line, before adjustments. The part covered by the down payment is in `downpayment_amount`.
        downpayment_amount:
          type: number
          description: Covered by the sales order down payment.
        adjustments:
          description: Additions to and deductions from the cash received on this line, both the ones entered by the user and the ones Jubelio added (`is_automatic`). Empty when there are none.
          type: array
          items:
            $ref: "#/components/schemas/CustomerPaymentAdjustment"
    CustomerPayment:
      type: object
      properties:
        payment_id:
          type: integer
          description: ID of the customer payment.
        payment_no:
          type: string
          description: Payment number, given by Jubelio when the payment is saved. The prefix comes from the merchant's settings (`CPAY` by default).
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment.
        contact_id:
          type: integer
          description: Contact ID of the customer. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Name of the customer, copied from the contact when the payment was saved.
        account_id:
          type: integer
          description: ID of the account the money went to. See `GET /finance/accounts`.
        account_code:
          type: string
          description: Code of the account the money went to.
        account_name:
          type: string
          description: Code and name of the account the money went to, as `code - name`.
        amount:
          type: number
          description: "Cash received: the sum over all lines of `amount` plus additions minus deductions. The part covered by down payments is not included."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the payment. `null` when there is none.
        is_cheque:
          type: boolean
          description: "`true` when the customer paid by cheque."
        cheque_number:
          type:
            - string
            - "null"
          description: Number of the cheque. `null` when the payment is not a cheque.
        cheque_date:
          type:
            - string
            - "null"
          format: date-time
          description: Date of the cheque. `null` when the payment is not a cheque.
        cheque_status:
          type:
            - string
            - "null"
          enum:
            - active
            - cancelled
            - null
          description: "`active` for a cheque that is in force, `cancelled` after the cheque was cancelled in Jubelio. `null` when the payment is not a cheque."
        tags:
          description: Tags on the payment. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the payment. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: File name of the attachment.
              url:
                type: string
                description: Link to the attached file.
        lines:
          description: Invoices paid by this payment, one line per invoice.
          type: array
          items:
            $ref: "#/components/schemas/CustomerPaymentLine"
        created_at:
          type: string
          format: date-time
          description: When the payment was created in Jubelio.
    CustomerPaymentCreate:
      type: object
      required:
        - contact_id
        - account_id
        - lines
      properties:
        contact_id:
          type: integer
          description: Contact ID of the customer who paid. Required. It must be a customer contact (`customer_not_found`). See `GET /finance/customer-contacts`.
        account_id:
          type: integer
          description: "ID of the account the money goes to: a Cash & Bank, other current asset, expense or other expense account. Required. Any other account fails with `payment_account_not_found`. See `GET /finance/accounts`."
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment. Optional, defaults to now. It must not be before the date of any invoice in `lines` (`transaction_date_invalid`).
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Free-text note on the payment. Optional. HTML tags are removed, and an empty string is stored as `null`.
        cheque:
          type: object
          description: Send when the customer paid by cheque.
          required:
            - number
            - date
          properties:
            number:
              type: string
              maxLength: 8
              description: Number of the cheque. Required when `cheque` is sent. It is stored in upper case and must not be used by any other payment (`cheque_number_duplicate`).
            date:
              type: string
              format: date
              description: Date of the cheque (ISO 8601). Required when `cheque` is sent.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of the tags to put on the payment. Optional, defaults to none. Every ID must be an existing tag, or the request fails with `tag_not_found`.
        attachments:
          description: Files to attach to the payment, kept in the order sent. Optional, defaults to none. The URLs are stored as sent; Jubelio does not download or check the files.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: File name shown for the attachment. Required.
              url:
                type: string
                maxLength: 1000
                description: Link to the file. Required.
        lines:
          type: array
          minItems: 1
          description: One line per invoice; each invoice once.
          items:
            type: object
            required:
              - invoice_id
            properties:
              invoice_id:
                type: integer
                minimum: 1
                description: ID of the invoice to pay. Required. It must be an unpaid or partly paid invoice of this customer (`invoice_not_found`, `invoice_paid`) and appear only once in `lines` (`invoice_repeated`). See `GET /finance/invoices`.
              amount:
                type: number
                minimum: 0
                description: Paid in cash or bank. Defaults to the rest of the invoice after the down payment.
              downpayment_amount:
                type: number
                minimum: 0
                description: Part of the invoice covered by the sales order down payment. Optional; by default the available down payment is used, up to what `amount` leaves open (the whole amount owed when `amount` is not sent). It must not exceed the available down payment (`downpayment_exceeds_available`).
              adjustments:
                type: array
                description: Manual additions or deductions. Automatic deductions are added by Jubelio.
                items:
                  type: object
                  required:
                    - type
                    - account_id
                    - amount
                  properties:
                    type:
                      type: string
                      enum:
                        - addition
                        - deduction
                      description: "`addition` adds `amount` to the cash received for the line, `deduction` subtracts it. Required."
                    account_id:
                      type: integer
                      description: ID of the account the adjustment is booked to, e.g. a bank fee expense account. Required. Any account can be used; an unknown ID fails with `account_not_found`. See `GET /finance/accounts`.
                    amount:
                      type: number
                      exclusiveMinimum: 0
                      description: Amount of the adjustment, greater than 0. Required. `type` says whether it is added or subtracted.
                    description:
                      type:
                        - string
                        - "null"
                      maxLength: 250
                      description: Free-text description of the adjustment, e.g. `Bank fee`. Optional. HTML tags are removed.
    SupplierPaymentSummary:
      type: object
      properties:
        payment_id:
          type: integer
          description: ID of the supplier payment.
        payment_no:
          type: string
          example: SPAY-000001234
          description: Payment number, given by Jubelio when the payment is saved. The prefix comes from the merchant's settings (`SPAY` by default).
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment.
        contact_id:
          type: integer
          description: Contact ID of the supplier. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, copied from the contact when the payment was saved.
        account_id:
          type: integer
          description: ID of the Cash & Bank account the money was paid from. See `GET /finance/accounts`.
        account_name:
          type: string
          description: Code and name of the Cash & Bank account the money was paid from, as `code - name`, copied when the payment was saved.
        amount:
          type: number
          description: "Cash paid out: the sum over all lines of `amount` plus additions minus deductions. The part covered by down payments is not included."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the payment. `null` when there is none.
        cheque_number:
          type:
            - string
            - "null"
          description: Number of the cheque. `null` when the payment is not a cheque.
        cheque_status:
          type:
            - string
            - "null"
          enum:
            - active
            - cancelled
            - null
          description: "`active` for a cheque that is in force, `cancelled` after the cheque was cancelled in Jubelio. `null` when the payment is not a cheque."
    SupplierPaymentAdjustment:
      type: object
      properties:
        type:
          type: string
          enum:
            - addition
            - deduction
          description: "`addition` adds `amount` to the cash paid out for the line, `deduction` subtracts it."
        account_id:
          type: integer
          description: ID of the account the adjustment is booked to. See `GET /finance/accounts`.
        account_name:
          type: string
          description: Name of the account the adjustment is booked to, without the code.
        amount:
          type: number
          description: Amount of the adjustment. `type` says whether it is added or subtracted.
        description:
          type:
            - string
            - "null"
          description: Free-text description of the adjustment. `null` when empty, which is always the case for automatic adjustments.
        is_automatic:
          type: boolean
          description: Added by Jubelio (income tax).
    SupplierPaymentLine:
      type: object
      properties:
        payment_detail_id:
          type: integer
          description: ID of the payment line.
        bill_id:
          type: integer
          description: ID of the bill paid on this line. See `GET /finance/bills`.
        bill_no:
          type: string
          description: Number of the bill.
        bill_date:
          type: string
          format: date-time
          description: Transaction date of the bill.
        bill_grand_total:
          type: number
          description: Grand total of the bill.
        bill_due:
          type: number
          description: Amount still owed on the bill now, after all its payments so far, not as of this payment.
        amount:
          type: number
          description: Part of the bill paid in cash or bank by this line, before adjustments. The part covered by the down payment is in `downpayment_amount`.
        downpayment_amount:
          type: number
          description: Covered by the purchase order down payment.
        adjustments:
          description: Additions to and deductions from the cash paid out on this line, both the ones entered by the user and the ones Jubelio added (`is_automatic`). Empty when there are none.
          type: array
          items:
            $ref: "#/components/schemas/SupplierPaymentAdjustment"
    SupplierPayment:
      type: object
      properties:
        payment_id:
          type: integer
          description: ID of the supplier payment.
        payment_no:
          type: string
          description: Payment number, given by Jubelio when the payment is saved. The prefix comes from the merchant's settings (`SPAY` by default).
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment.
        contact_id:
          type: integer
          description: Contact ID of the supplier. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, copied from the contact when the payment was saved.
        account_id:
          type: integer
          description: ID of the Cash & Bank account the money was paid from. See `GET /finance/accounts`.
        account_name:
          type: string
          description: Code and name of the Cash & Bank account the money was paid from, as `code - name`.
        amount:
          type: number
          description: "Cash paid out: the sum over all lines of `amount` plus additions minus deductions. The part covered by down payments is not included."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the payment. `null` when there is none.
        is_cheque:
          type: boolean
          description: "`true` when the payment was made by cheque."
        cheque_number:
          type:
            - string
            - "null"
          description: Number of the cheque. `null` when the payment is not a cheque.
        cheque_date:
          type:
            - string
            - "null"
          format: date-time
          description: Date of the cheque. `null` when the payment is not a cheque.
        cheque_status:
          type:
            - string
            - "null"
          enum:
            - active
            - cancelled
            - null
          description: "`active` for a cheque that is in force, `cancelled` after the cheque was cancelled in Jubelio. `null` when the payment is not a cheque."
        tags:
          description: Tags on the payment. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the payment. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: File name of the attachment.
              url:
                type: string
                description: Link to the attached file.
        lines:
          description: Bills paid by this payment, one line per bill.
          type: array
          items:
            $ref: "#/components/schemas/SupplierPaymentLine"
        created_at:
          type: string
          format: date-time
          description: When the payment was created in Jubelio.
    SupplierPaymentCreate:
      type: object
      required:
        - contact_id
        - account_id
        - lines
      properties:
        contact_id:
          type: integer
          description: Contact ID of the supplier being paid. Required. It must be a supplier contact (`supplier_not_found`). See `GET /finance/supplier-contacts`.
        account_id:
          type: integer
          description: ID of the Cash & Bank account the money is paid from. Required. Any other account fails with `payment_account_not_found`. See `GET /finance/accounts`.
        transaction_date:
          type: string
          format: date-time
          description: Date of the payment. Optional, defaults to now. It must not be before the date of any bill in `lines` (`transaction_date_invalid`).
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Free-text note on the payment. Optional. HTML tags are removed, and an empty string is stored as `null`.
        cheque:
          type: object
          description: Send when paying by cheque.
          required:
            - number
            - date
          properties:
            number:
              type: string
              maxLength: 8
              description: Number of the cheque. Required when `cheque` is sent. It is stored in upper case and must not be used by any other payment (`cheque_number_duplicate`).
            date:
              type: string
              format: date
              description: Date of the cheque (ISO 8601). Required when `cheque` is sent.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of the tags to put on the payment. Optional, defaults to none. Every ID must be an existing tag, or the request fails with `tag_not_found`.
        attachments:
          description: Files to attach to the payment, kept in the order sent. Optional, defaults to none. The URLs are stored as sent; Jubelio does not download or check the files.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: File name shown for the attachment. Required.
              url:
                type: string
                maxLength: 1000
                description: Link to the file. Required.
        lines:
          type: array
          minItems: 1
          description: One line per bill; each bill once.
          items:
            type: object
            required:
              - bill_id
            properties:
              bill_id:
                type: integer
                minimum: 1
                description: ID of the bill to pay. Required. It must be an unpaid or partly paid bill of this supplier or of one of the supplier's purchase orders (`bill_not_found`, `bill_paid`) and appear only once in `lines` (`bill_repeated`). See `GET /finance/bills`.
              amount:
                type: number
                minimum: 0
                description: Paid in cash or bank. Defaults to the rest of the bill after the down payment.
              downpayment_amount:
                type: number
                minimum: 0
                description: Part of the bill covered by the purchase order down payment. Optional; by default the available down payment is used, up to what `amount` leaves open (the whole amount owed when `amount` is not sent). Bills of the same purchase order share its down payment, so a line can only use what earlier lines left. It must not exceed the available down payment (`downpayment_exceeds_available`).
              adjustments:
                type: array
                description: Manual additions or deductions. Automatic deductions are added by Jubelio.
                items:
                  type: object
                  required:
                    - type
                    - account_id
                    - amount
                  properties:
                    type:
                      type: string
                      enum:
                        - addition
                        - deduction
                      description: "`addition` adds `amount` to the cash paid out for the line, `deduction` subtracts it. Required."
                    account_id:
                      type: integer
                      description: ID of the account the adjustment is booked to, e.g. a bank fee expense account. Required. Any account can be used; an unknown ID fails with `account_not_found`. See `GET /finance/accounts`.
                    amount:
                      type: number
                      exclusiveMinimum: 0
                      description: Amount of the adjustment, greater than 0. Required. `type` says whether it is added or subtracted.
                    description:
                      type:
                        - string
                        - "null"
                      maxLength: 250
                      description: Free-text description of the adjustment, e.g. `Bank fee`. Optional. HTML tags are removed.
    CashBankTransactionSummary:
      type: object
      properties:
        transaction_id:
          type: integer
          description: ID of the cash and bank transaction.
        transaction_no:
          type: string
          example: REC-000000123
          description: Transaction number, given by Jubelio when the transaction is saved. Receives and payments are numbered separately, with prefixes from the merchant's settings (`REC` and `PAY` by default).
        type:
          type: string
          enum:
            - receive
            - payment
          description: "`receive` when money came into the Cash & Bank account, `payment` when money went out of it."
        transaction_date:
          type: string
          format: date-time
          description: Date of the transaction.
        contact_name:
          type: string
          description: Name of the contact, copied from the contact when the transaction was saved.
        account_code:
          type: string
          description: Code of the Cash & Bank account the money went into or out of.
        account_name:
          type: string
          description: Code and name of the Cash & Bank account, as `code - name`.
        amount:
          type: number
          description: "Total of the transaction: the sum of its line amounts."
        settlement_no:
          type:
            - string
            - "null"
          description: Number of the marketplace settlement that made this transaction. `null` when the transaction was not made by a settlement.
        created_at:
          type: string
          format: date-time
          description: When the transaction was created in Jubelio.
    CashBankTransactionLine:
      type: object
      properties:
        line_id:
          type: integer
          description: ID of the transaction line.
        account_id:
          type: integer
          description: ID of the account this line is booked to. See `GET /finance/accounts`.
        account_code:
          type: string
          description: Code of the account this line is booked to.
        account_name:
          type: string
          description: Name of the account this line is booked to, without the code.
        description:
          type:
            - string
            - "null"
          description: Free-text description of the line. `null` when empty.
        amount:
          type: number
          description: Amount of the line.
    CashBankTransaction:
      type: object
      properties:
        transaction_id:
          type: integer
          description: ID of the cash and bank transaction.
        transaction_no:
          type: string
          description: Transaction number, given by Jubelio when the transaction is saved. Receives and payments are numbered separately, with prefixes from the merchant's settings (`REC` and `PAY` by default).
        type:
          type: string
          enum:
            - receive
            - payment
          description: "`receive` when money came into the Cash & Bank account, `payment` when money went out of it."
        transaction_date:
          type: string
          format: date-time
          description: Date of the transaction.
        contact_id:
          type: integer
          description: Contact ID of the customer or supplier. See `GET /finance/customer-contacts` and `GET /finance/supplier-contacts`.
        contact_name:
          type: string
          description: Name of the contact, copied from the contact when the transaction was saved.
        account_id:
          type: integer
          description: ID of the Cash & Bank account the money went into (`receive`) or out of (`payment`). See `GET /finance/accounts`.
        account_name:
          type: string
          description: Code and name of the Cash & Bank account, as `code - name`, copied when the transaction was saved.
        amount:
          type: number
          description: "Total of the transaction: the sum of its line amounts."
        note:
          type:
            - string
            - "null"
          description: Free-text note on the transaction. `null` when there is none.
        tags:
          description: Tags on the transaction. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
                description: ID of the tag.
              tag_name:
                type: string
                description: Name of the tag.
        attachments:
          description: Files attached to the transaction. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: File name of the attachment.
              url:
                type: string
                description: Link to the attached file.
        lines:
          description: Lines of the transaction, each booked to its own account against the Cash & Bank account.
          type: array
          items:
            $ref: "#/components/schemas/CashBankTransactionLine"
    CashBankTransactionCreate:
      type: object
      required:
        - type
        - contact_id
        - account_id
        - lines
      properties:
        type:
          type: string
          enum:
            - receive
            - payment
          description: "`receive` when money comes into the Cash & Bank account, `payment` when money goes out of it. Required. Receives and payments are numbered separately."
        contact_id:
          type: integer
          description: Contact ID of a customer or supplier (not an employee). Required. Any other contact fails with `contact_not_found`. See `GET /finance/customer-contacts` and `GET /finance/supplier-contacts`.
        account_id:
          type: integer
          description: ID of the Cash & Bank account the money goes into or out of. Required. Any other account fails with `cashbank_account_not_found`. See `GET /finance/accounts`.
        transaction_date:
          type: string
          format: date-time
          description: Date of the transaction. Optional, defaults to now.
        note:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Free-text note on the transaction. Optional. HTML tags are removed, and an empty string is stored as `null`.
        tag_ids:
          type: array
          items:
            type: integer
            minimum: 1
          uniqueItems: true
          description: IDs of the tags to put on the transaction. Optional, defaults to none. Every ID must be an existing tag, or the request fails with `tag_not_found`.
        attachments:
          description: Files to attach to the transaction, kept in the order sent. Optional, defaults to none. The URLs are stored as sent; Jubelio does not download or check the files.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: File name shown for the attachment. Required.
              url:
                type: string
                maxLength: 1000
                description: Link to the file. Required.
        lines:
          description: Lines of the transaction, at least one. Required. Each line is booked to its own account, and the transaction `amount` is the sum of the line amounts.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - account_id
              - amount
            properties:
              account_id:
                type: integer
                minimum: 1
                description: ID of the account this line is booked to, against the Cash & Bank account, e.g. an income account for bank interest. Required. Any account can be used; an unknown ID fails with `account_not_found`. See `GET /finance/accounts`.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Free-text description of the line. Optional. HTML tags are removed.
              amount:
                type: number
                exclusiveMinimum: 0
                description: Amount of the line, greater than 0. Required. Whether it is money in or out follows from `type`.
