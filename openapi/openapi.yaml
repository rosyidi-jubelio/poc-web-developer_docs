              - archived
            default: active
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: category_id
          in: query
          description: Only products in this Jubelio category
          schema:
            type: integer
            minimum: 1
        - name: is_bundle
          in: query
          description: Only bundle (`true`) or non-bundle (`false`) products
          schema:
            type: boolean
        - name: last_modified_since
          in: query
          description: Only products changed on or after this date (ISO 8601). Useful for periodic sync.
          schema:
            type: string
            format: date
            example: 2026-10-01
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
