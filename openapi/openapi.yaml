  /finance/sales-orders:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List sales orders
      description: |
        Sales orders of all channels, newest transaction date first. Like in
        Jubelio, Shopee orders older than 90 days are not listed.
        Requires scope `finance.sales_order.read`.
      operationId: listSalesOrders
      x-scope: finance.sales_order.read
      parameters:
        - name: q
          in: query
          description: Search the order number, customer, recipient, tracking number, ref_no or booking number.
          schema:
            type: string
        - name: transaction_date_from
          in: query
          description: Only orders with `transaction_date` on or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only orders with `transaction_date` on or before this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: last_modified_since
          in: query
          description: Only orders changed on or after this day (ISO 8601). Only the date part is used; the time is ignored.
          schema:
            type: string
            format: date-time
        - name: channel_id
          in: query
          description: Only orders of this channel (e.g. 1 INTERNAL, 64 Shopee).
          schema:
            type: integer
        - name: store_id
          in: query
          schema:
            type: integer
          description: Only orders of this store.
        - name: location_id
          in: query
          schema:
            type: integer
          description: Only orders whose stock is taken from this location. See `GET /locations`.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Sales orders on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/SalesOrderSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a sales order
      description: |
        Creates a manual sales order with an automatic order number, like the
        order editor in Jubelio. Orders cannot be updated, cancelled or deleted
        through the API. Requires scope `finance.sales_order.create`.

        **Source:** send `store_id` of an active internal store (channel
        INTERNAL), or `channel_id` of a channel that has no store connected to
        Jubelio. Orders of connected marketplace stores come from the
        marketplace and cannot be created here.

        **Amounts are calculated by Jubelio**, the same way as invoices: each
        line is `qty x price` minus its discount (`disc` % or `disc_amount`),
        `add_disc` is split over the lines by their value, and tax follows
        `is_tax_included`. `grand_total` = lines + tax + `insurance_cost` +
        (`shipping_cost` - `shipping_cost_discount`) + `add_fee` -
        `service_fee` - `order_processing_fee` + extra costs -
        `loyalty_discount`.

        **Shipping** defaults to the customer: recipient name and phone,
        shipping address (else billing address), region and post code of the
        contact. Each `shipping` field overrides its default; `subdistrict_id`
        (from `GET /regions`) sets the whole region.

        `is_paid: true` marks the order paid, so the warehouse can pick it.
        Stock is reserved for the order. Not available through the API:
        Jubelio Shipment, COD, vouchers and payment links.

        Errors (`400`): `validation_error`, `customer_not_found`,
        `store_not_found`, `channel_not_found`, `channel_not_allowed`,
        `location_not_found`, `item_not_found`, `bundle_without_bom`,
        `tax_not_found`, `promotion_not_found`, `add_cost_setting_not_found`,
        `salesmen_not_found`, `courier_not_found`, `region_not_found`,
        `order_total_negative`, `request_rejected`.
      operationId: createSalesOrder
      x-scope: finance.sales_order.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderCreate"
            examples:
              internalStore:
                summary: Paid order of an internal store
                value:
                  contact_id: 963505
                  store_id: -100
                  location_id: 417
                  is_paid: true
                  courier: JNE REG
                  shipping_cost: 9000
                  lines:
                    - item_id: 22761
                      qty: 2
                      price: 50000
                      disc: 10
              otherChannel:
                summary: Order of a channel without a store, shipped to another address
                value:
                  contact_id: 963505
                  channel_id: 32768
                  location_id: 417
                  shipping:
                    full_name: Budi
                    phone: "08123456789"
                    address: Jl. Merdeka 1
                    subdistrict_id: "3171010001"
                    post_code: "10110"
                  lines:
                    - item_id: 22761
                      qty: 1
                      price: 20000
                      disc_amount: 5000
                      tax_id: -2
      responses:
        "201":
          description: Created. Returns the order as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /finance/sales-orders/{id}:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: Get a sales order
      description: A sales order with its lines, shipping and amounts. Phone numbers are masked. Requires scope `finance.sales_order.read`.
      operationId: getSalesOrder
      x-scope: finance.sales_order.read
      parameters:
        - name: id
