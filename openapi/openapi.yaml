        "404":
          $ref: "#/components/responses/NotFound"
  /finance/sales-orders/{id}/escrow:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: Get the marketplace escrow of a sales order
      description: |
        The escrow (what the marketplace pays out for the order) as Jubelio
        received it from the marketplace. Requires scope
        `finance.sales_order_escrow.read`.

        `escrow_list` is the marketplace's own data, so its shape depends on
        `source`:
        - Shopee (64): an object of amounts, e.g. `commission_fee`,
          `voucher_from_seller`, `escrow_amount`.
        - Lazada (4): a list of fee rows (`fee_name`, `amount_lazada`, ...).
        - TikTok Shop (131076) and Tokopedia (128): a list with a
          `settlement_info` object, or an object with `version: v2` and
          `sku_transactions`.

        `escrow_list` is null until the marketplace has sent the escrow.
      operationId: getSalesOrderEscrow
      x-scope: finance.sales_order_escrow.read
      parameters:
        - name: id
          in: path
          required: true
          description: Sales order id.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SalesOrderEscrow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
