  /finance/sales-returns:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List sales returns
      description: |
        Sales returns (credit notes), newest transaction date first. Requires
        scope `finance.sales_return.read`.
      operationId: listSalesReturns
      x-scope: finance.sales_return.read
      parameters:
        - name: q
          in: query
          description: Search text, at least 3 characters. Matches the return number, reference number, invoice number, item name or code, or the customer name of the linked invoice.
          schema:
            type: string
            minLength: 3
        - name: status
          in: query
          description: "Settlement status. `paid`: nothing is left to refund or offset. `unpaid`: an amount is still open (this also matches overdue returns). `overdue`: an amount is still open and the due date is today or earlier. Repeat the parameter to match several. Defaults to all."
          schema:
            type: array
            items:
              type: string
              enum:
                - paid
                - unpaid
                - overdue
          style: form
          explode: true
        - name: transaction_date_from
          in: query
          description: Only returns with a transaction date at or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only returns with a transaction date at or before this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: last_modified_since
          in: query
          description: Only returns changed at or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Sales returns on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/SalesReturnSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a sales return
      description: |
        Creates a sales return with an automatic return number, either for an
        invoice or without one. Line amounts, tax and totals are calculated by
        Jubelio the same way as when the merchant creates the return in
        Jubelio. Returns cannot be updated or deleted through the API.
        Requires scope `finance.sales_return.create`.

        **With `invoice_id`:** send `invoice_detail_id` and `qty` per line.
        Item, price, discount percentage, tax and unit come from the invoice
        line. Customer, location, channel and tax mode come from the invoice.
        When the merchant's sales return setting includes other fees, the
        invoice's additional discount is prorated by the returned value, its
        `add_fee` and `service_fee` are carried over, and
        `order_processing_fee` is carried over only when every invoiced unit
        is returned. The invoice's loyalty discount is prorated by the
        returned value and its shipping tax is carried over.

        **Without `invoice_id`:** send `contact_id`, `location_id` and per
        line `item_id`, `qty` and `price`, like creating an invoice. Fees and
        the additional discount are only accepted when the sales return
        setting includes other fees.

        `auto_placement: true` also puts the returned stock away to its bins,
        like "Save & Place" in Jubelio.

        Errors (`400`): `validation_error`, `invoice_not_found`,
        `invoice_line_not_found`, `qty_exceeds_invoice`, `line_invalid`,
        `transaction_date_invalid`, `customer_not_found`, `item_not_found`,
        `tax_not_found`, `location_not_found`, `tag_not_found`,
        `channel_not_found`, `store_not_found`, `store_channel_mismatch`,
        `add_cost_setting_not_found`, `add_cost_exceeds_invoice`,
        `return_add_costs_disabled`,
        `return_fees_disabled`, `return_total_negative`, `request_rejected`
        (rejected by a return rule in Jubelio, e.g. serial/batch number checks).
      operationId: createSalesReturn
      x-scope: finance.sales_return.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesReturnCreate"
            examples:
              withInvoice:
                summary: Return part of an invoice
                value:
                  invoice_id: 55812
                  note: Barang rusak
                  lines:
                    - invoice_detail_id: 72375
                      qty: 1
              withoutInvoice:
                summary: Return without an invoice
                value:
                  contact_id: 180679
                  location_id: -1
                  is_tax_included: false
                  lines:
                    - item_id: 20727
                      qty: 1
                      price: 61667
                      tax_id: 1
      responses:
        "201":
          description: Created. Returns the sales return as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SalesReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /finance/sales-returns/{id}:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: Get a sales return
      description: A sales return with its lines, fees and additional costs. Requires scope `finance.sales_return.read`.
      operationId: getSalesReturn
      x-scope: finance.sales_return.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID of the sales return (`sales_return_id`). See `GET /finance/sales-returns`.
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SalesReturn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /finance/bills:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List bills
      description: |
        Purchase bills, newest transaction date first. Consignment bills are
        not included. Requires scope `finance.bill.read`.
      operationId: listBills
      x-scope: finance.bill.read
      parameters:
        - name: q
          in: query
          description: Search bill number, supplier name, purchase order number, reference number, item name or code.
          schema:
            type: string
        - name: status
          in: query
          description: Payment status to match. Repeat the parameter to match several. `unpaid` matches every bill with an amount still due, overdue bills included; `overdue` matches only those on or after their due date; `paid` matches bills with nothing left to pay. Defaults to all.
          schema:
            type: array
            items:
              type: string
              enum:
                - paid
                - unpaid
                - overdue
          style: form
          explode: true
        - name: transaction_date_from
          in: query
          description: Only bills with a transaction date on or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only bills with a transaction date on or before this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Bills on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/BillSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a bill
      description: |
        Creates a purchase bill from a supplier with an automatic bill number.
        Send quantities, prices and discounts only: line amounts, tax and
        totals are calculated by Jubelio, the same way as when the merchant
        creates the bill in Jubelio. Bills cannot be updated or deleted
        through the API. Requires scope `finance.bill.create`.

        - The due date is the transaction date plus `payment_term` days
          (default: the supplier's payment term). Payment cannot be recorded
          while creating the bill, so a term of 0 days (cash bill) is
          rejected with `cash_bill_not_supported`.
        - Line defaults come from the item: account (inventory account for
          stock items, purchase account otherwise), purchase unit and
          purchase tax.
        - `grand_total` = amount before tax + tax + sum of `add_costs`.
        - Serial numbers or batches, when sent, must add up to the line
          `qty`. When none are sent, Jubelio generates them for items that
          track them.
        - `auto_placement: true` also puts the received stock away to its
          bins, like "Save & Place" in Jubelio.

        Bills from a purchase order and consignment bills cannot be created
        here.

        Errors (`400`): `validation_error`, `supplier_not_found`,
        `cash_bill_not_supported`, `location_not_found`, `item_not_found`,
        `item_is_consignment`, `tax_not_found`, `tag_not_found`,
        `add_cost_setting_not_found`, `serial_not_tracked`,
        `serial_qty_mismatch`, `batch_not_tracked`, `batch_qty_mismatch`,
        `request_rejected` (rejected by a bill rule in Jubelio).
      operationId: createBill
      x-scope: finance.bill.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillCreate"
            example:
              contact_id: 2045
              transaction_date: 2026-11-17T09:00:00+07:00
              payment_term: 30
              location_id: -1
              is_tax_included: false
              note: Restock November
              lines:
                - item_id: 21
                  qty: 10
                  price: 150000
                  disc: 5
                  tax_id: 2
                - item_id: 20727
                  qty: 4
                  price: 40000
