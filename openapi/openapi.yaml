                summary: Purchase order with a discount and PPN
                value:
                  contact_id: 920078
                  location_id: 417
                  is_tax_included: true
                  lines:
                    - item_id: 22761
                      qty: 3
                      price: 11100
                      disc: 10
                      tax_id: -2
                    - item_id: 22761
                      qty: 1
                      price: 5000
      responses:
        "201":
          description: Created. Returns the order as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
