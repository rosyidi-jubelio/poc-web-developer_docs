        account_code:
          type: string
          description: Code of the account in the chart of accounts.
        account_name:
          type: string
          description: Name of the account.
        category_name:
          type: string
          description: Name of the account category. See `GET /finance/accounts/categories`.
        bank_id:
          type:
            - integer
            - "null"
          description: ID of the bank in Jubelio's bank list, set on bank accounts. `null` when not set.
        is_system_account:
          type: boolean
          description: "`true` for built-in accounts (an `account_id` of 0 or less) and for accounts set as a default account in the merchant's accounting settings, such as receivables, payables, inventory or sales."
    Account:
      type: object
      properties:
        account_id:
          type: integer
          description: ID of the account.
        account_code:
          type: string
          description: Code of the account in the chart of accounts.
        account_name:
          type: string
          description: Name of the account.
        category_id:
          type: integer
          description: ID of the account category. See `GET /finance/accounts/categories`.
        category_name:
