      summary: List purchase returns
      description: |
        Purchase returns (debit notes), newest transaction date first.
        Requires scope `finance.purchase_return.read`.
      operationId: listPurchaseReturns
      x-scope: finance.purchase_return.read
      parameters:
        - name: q
          in: query
          description: Search return number, supplier name, bill number, item name or code.
          schema:
            type: string
        - name: status
          in: query
          description: "Only returns with this settlement status. `paid`: nothing is left to refund or offset. `overdue`: an amount is still open and the return is dated today or earlier. `unpaid`: an amount is still open; this also matches `overdue` returns. A purchase return counts as due from its own transaction date. Repeat the parameter to match several. Defaults to all."
          schema:
            type: array
            items:
              type: string
              enum:
                - paid
                - unpaid
                - overdue
          style: form
          explode: true
        - name: transaction_date_from
          in: query
          description: Only returns with a transaction date at or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only returns with a transaction date at or before this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Purchase returns on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/PurchaseReturnSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a purchase return
      description: |
        Creates a purchase return with an automatic return number, either for
        a bill or without one. Line amounts, tax and totals are calculated by
        Jubelio the same way as when the merchant creates the return in
        Jubelio. Returns cannot be updated or deleted through the API.
        Requires scope `finance.purchase_return.create`.

        **With `bill_id`:** send `bill_detail_id` and `qty` per line. Price,
        unit, tax, discount percentage, account and bin come from the bill
        line; supplier, location and tax mode come from the bill. The qty
        must not exceed what is left to return on the bill line.

        **Without `bill_id`:** send `contact_id`, `location_id` and per line
        `item_id`, `qty` and `price`. Defaults come from the item: inventory
        account, purchase unit and purchase tax.

        `add_costs` are only accepted when the merchant's return setting
        allows additional costs on purchase returns; with `bill_id` their
        total must not exceed the bill's additional cost.
        `grand_total` = amount before tax + tax + sum of `add_costs`.

        Errors (`400`): `validation_error`, `bill_not_found`,
        `bill_line_not_found`, `qty_exceeds_bill`, `line_invalid`,
        `transaction_date_invalid`, `supplier_not_found`, `item_not_found`,
        `tax_not_found`, `location_not_found`, `bin_not_found`,
        `tag_not_found`, `add_cost_setting_not_found`,
        `return_add_costs_disabled`, `add_cost_exceeds_bill`,
        `request_rejected` (rejected by a return rule in Jubelio, e.g.
        serial/batch number checks).
      operationId: createPurchaseReturn
      x-scope: finance.purchase_return.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseReturnCreate"
            examples:
              withBill:
                summary: Return part of a bill
                value:
                  bill_id: 13693
                  note: Barang cacat
                  lines:
                    - bill_detail_id: 20881
                      qty: 2
              withoutBill:
                summary: Return without a bill
                value:
                  contact_id: 21674
                  location_id: 408
                  is_tax_included: false
                  lines:
                    - item_id: 37
                      qty: 1
                      price: 100000
                      tax_id: -2
      responses:
        "201":
          description: Created. Returns the purchase return as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PurchaseReturn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
