        `status` selects the product list:

        | status | products |
        |---|---|
        | `active` | catalog (master) products, not archived |
        | `need_review` | products pulled from a channel that are not part of the catalog yet |
        | `in_review` | products currently in review |
        | `archived` | archived products |
      operationId: listProducts
      x-scope: product.read
      parameters:
        - name: status
          in: query
