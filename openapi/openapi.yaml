        mobile:
          type:
            - string
            - "null"
          description: Mobile phone number of the contact. `null` when empty.
        fax:
          type:
            - string
            - "null"
          description: Fax number of the contact. `null` when empty.
        date_of_birth:
          type:
            - string
            - "null"
          format: date-time
          description: Date of birth of the customer. `null` when not set.
        country_id:
          type:
            - integer
            - "null"
          description: ID of the customer's country. `null` when no country is set.
        country_name:
          type:
            - string
            - "null"
          description: Name of the customer's country. `null` when no country is set.
        source:
          type:
            - string
            - "null"
          enum:
            - marketplace
            - social_media
            - null
          description: How the customer was acquired, as set on the contact. `null` when not set. See `source_detail` for the free-text detail.
        source_detail:
          type:
            - string
            - "null"
          description: Free-text detail of where the customer came from, next to `source`. `null` when empty.
        npwp:
          type:
            - string
            - "null"
          description: Tax ID (NPWP) of the contact. `null` when not filled in.
        nik:
          type:
            - string
            - "null"
          description: National ID number (NIK, 16 digits) of the contact. `null` when not filled in.
        npwp_address:
          type: object
          description: Address on the customer's NPWP, used for tax invoices.
          properties:
            name:
              type:
                - string
                - "null"
              description: Name on the NPWP. `null` when empty.
            street:
              type:
                - string
                - "null"
              description: Street of the NPWP address. `null` when empty.
            block:
              type:
                - string
                - "null"
              description: Block of the NPWP address. `null` when empty.
            house_no:
              type:
                - string
                - "null"
              description: House number of the NPWP address. `null` when empty.
            rt:
              type:
                - string
                - "null"
              description: RT (rukun tetangga, neighbourhood unit) number of the NPWP address. `null` when empty.
            rw:
              type:
                - string
                - "null"
              description: RW (rukun warga, community unit) number of the NPWP address. `null` when empty.
            subdistrict_id:
              type:
                - string
                - "null"
              description: ID of the subdistrict (kelurahan) of the NPWP address. See `GET /regions` with `level=subdistrict`. `null` when not set.
            subdistrict:
              type:
                - string
                - "null"
              description: Name of the subdistrict (kelurahan) of the NPWP address. `null` when not set.
            district_id:
              type:
                - string
                - "null"
              description: ID of the district (kecamatan) of the NPWP address. See `GET /regions` with `level=district`. `null` when not set.
            district:
              type:
                - string
                - "null"
              description: Name of the district (kecamatan) of the NPWP address. `null` when not set.
            city_id:
              type:
                - string
                - "null"
              description: ID of the city of the NPWP address. See `GET /regions` with `level=city`. `null` when not set.
            city:
              type:
                - string
                - "null"
              description: Name of the city of the NPWP address. `null` when not set.
            province_id:
              type:
                - string
                - "null"
              description: ID of the province of the NPWP address. See `GET /regions` with `level=province`. `null` when not set.
            province:
              type:
                - string
                - "null"
              description: Name of the province of the NPWP address. `null` when not set.
            post_code:
              type:
                - string
                - "null"
              description: Postal code of the NPWP address. `null` when not set.
        payment_term:
          type:
            - integer
            - "null"
          description: Default payment term of the customer, in days. `null` when none is set.
        notes:
          type:
            - string
            - "null"
          description: Free-text notes on the contact. `null` when empty.
        billing_address:
          $ref: "#/components/schemas/ContactAddress"
        shipping_address:
          $ref: "#/components/schemas/ContactAddress"
        receivable_due:
          type: number
          description: "Amount the customer still owes: the sum of the remaining due of all the customer's invoices that are not fully paid. `0` when nothing is owed."
        deposit_balance:
          type: number
          description: "Unused amount of the customer's deposits: the sum of the remaining balance of every deposit not yet used up. `0` when there is none."
        created_at:
          type: string
          format: date-time
          description: When the contact was created.
    SalesOrderSummary:
      type: object
      properties:
        salesorder_id:
          type: integer
          description: ID of the sales order. Use it with `GET /finance/sales-orders/{id}`.
        salesorder_no:
          type: string
          example: SO-000012345
          description: Order number shown in Jubelio.
        transaction_date:
          type: string
          format: date-time
          description: Date of the order.
        customer_name:
          type: string
          description: Name of the customer as stored on the order.
        shipping_full_name:
          type:
            - string
            - "null"
          description: Name of the recipient. Falls back to the customer name when the order has no recipient name.
        channel_id:
          type: integer
          description: ID of the sales channel of the order, e.g. `1` INTERNAL, `64` Shopee.
        channel_name:
          type: string
          description: Name of the sales channel, e.g. `SHOPEE`.
        store_id:
          type:
            - integer
            - "null"
          description: ID of the store the order belongs to (an internal store or a connected marketplace store). `null` when the order has no store.
        store_name:
          type:
            - string
            - "null"
          description: Name of the store. `null` when the order has no store.
        location_name:
          type: string
          description: Name of the location the stock is taken from.
        grand_total:
          type: number
          description: Total amount of the order after discounts, tax, shipping, fees and extra costs. See `grand_total` in `GET /finance/sales-orders/{id}` for the formula.
        is_paid:
          type: boolean
          description: Whether the order is paid.
        is_canceled:
          type: boolean
          description: Whether the order is canceled.
        channel_status:
          type:
            - string
            - "null"
          description: Display name of the order status on the channel, e.g. `Paid` or `Pending`. Falls back to the stored status code when Jubelio has no display name for it.
        wms_status:
          type:
            - string
            - "null"
          description: Warehouse step of the order, e.g. `PROCESS`, `PICK`, `FINISH_PICK`, `PACK`, `FINISH_PACK`, `READY_TO_SHIP`, `SHIPPED` or `COMPLETED`. `null` when the order has no warehouse status yet.
        courier:
          type:
            - string
            - "null"
          description: Courier of the order, e.g. `JNE REG`. `null` when no courier is set.
        tracking_no:
          type:
            - string
            - "null"
          description: Tracking number (air waybill) of the shipment. `null` when not known yet.
        ref_no:
          type:
            - string
            - "null"
          description: Reference number of the order. `null` when empty.
        invoice_no:
          type:
            - string
            - "null"
          description: Number of the invoice made from this order (the invoice whose `ref_no` is this order number). `null` when the order is not invoiced yet.
        created_at:
          type: string
          format: date-time
          description: When the order was created in Jubelio.
        last_modified:
          type:
            - string
            - "null"
          format: date-time
          description: When the order was last changed.
    SalesOrderLine:
      type: object
      properties:
        salesorder_detail_id:
          type: integer
          description: ID of the order line.
        item_id:
          type: integer
          description: ID of the item (the `sku_id` in `GET /catalog/products`).
        item_code:
          type: string
          description: Code (SKU) of the item.
        item_name:
          type: string
          description: Name of the item, followed by its variation values when it has any.
        description:
          type:
            - string
            - "null"
          description: Description of the line. `null` when empty.
        qty:
          type: number
          description: Quantity ordered, in `unit`. `price` is per `unit`.
        unit:
          type:
            - string
            - "null"
          description: Unit of the line. Orders created through the API use the item's sales unit.
        price:
          type: number
          description: Unit price.
        disc:
          type: number
          description: Line discount in percent of `qty` x `price`.
        disc_amount:
          type: number
          description: Line discount as an amount. When the discount was given in percent, this is `qty` x `price` x `disc` / 100.
        tax_id:
          type: integer
          description: ID of the tax on the line. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax. `null` when unknown.
        tax_amount:
          type: number
          description: Tax of the line. When `is_tax_included` is `true`, it is the tax part inside `amount`; otherwise it is `amount` x the tax rate.
        amount:
          type: number
          description: "Line amount: `qty` x `price` minus the line discount and the line's share of `add_disc`, never below 0. Includes tax when `is_tax_included` is `true`; otherwise tax is added on top."
        is_free_gift:
          type: boolean
          description: Whether the line is a free gift.
        promotion_id:
          type:
            - integer
            - "null"
          description: ID of the promotion the line belongs to. `null` when the line is not part of a promotion.
        is_canceled:
          type: boolean
          description: Whether this line is canceled.
    SalesOrderShipping:
      type: object
      properties:
        full_name:
          type:
            - string
            - "null"
          description: Name of the recipient. `null` when empty.
        phone:
          type:
            - string
            - "null"
          description: "Phone number of the recipient, masked: all but the last 2 characters are replaced with `*`. `null` when empty."
        address:
          type:
            - string
            - "null"
          description: Shipping address. `null` when empty.
        subdistrict_id:
          type:
            - string
            - "null"
          description: ID of the subdistrict. See `GET /regions` with `level=subdistrict`. `null` when not set.
        subdistrict:
          type:
            - string
            - "null"
          description: Name of the subdistrict. `null` when not set.
        district_id:
          type:
            - string
            - "null"
          description: ID of the district. See `GET /regions` with `level=district`. `null` when not set.
        district:
          type:
            - string
            - "null"
          description: Name of the district. `null` when not set.
        city_id:
          type:
            - string
            - "null"
          description: ID of the city. See `GET /regions` with `level=city`. `null` when not set.
        city:
          type:
            - string
            - "null"
          description: Name of the city. `null` when not set.
        province_id:
          type:
            - string
            - "null"
          description: ID of the province. See `GET /regions` with `level=province`. `null` when not set.
        province:
          type:
            - string
            - "null"
          description: Name of the province. `null` when not set.
        post_code:
          type:
            - string
            - "null"
          description: Post code of the shipping address. `null` when empty.
    SalesOrder:
      type: object
      properties:
        salesorder_id:
          type: integer
          description: ID of the sales order.
        salesorder_no:
          type: string
          description: Order number shown in Jubelio. Orders created through the API get the next number automatically.
        transaction_date:
          type: string
          format: date-time
          description: Date of the order.
        contact_id:
          type: integer
          description: Contact ID of the customer. See `GET /finance/customer-contacts`.
        customer_name:
          type: string
          description: Name of the customer as stored on the order.
        channel_id:
          type: integer
          description: ID of the sales channel of the order, e.g. `1` INTERNAL, `64` Shopee.
        channel_name:
          type: string
          description: Name of the sales channel, e.g. `SHOPEE`.
        store_id:
          type:
            - integer
            - "null"
          description: ID of the store the order belongs to (an internal store or a connected marketplace store). `null` when the order has no store.
        store_name:
          type:
            - string
            - "null"
          description: Name of the store. `null` when the order has no store.
        location_id:
          type: integer
          description: ID of the location the stock is taken from. See `GET /locations`.
        location_name:
          type: string
          description: Name of the location the stock is taken from.
        salesmen_id:
          type:
            - integer
            - "null"
          description: ID of the salesperson of the order. `null` when none is set.
        salesmen_name:
          type:
            - string
            - "null"
          description: Name of the salesperson. `null` when none is set.
        ref_no:
          type:
            - string
            - "null"
          description: Reference number of the order. `null` when empty.
        note:
          type:
            - string
            - "null"
          description: Note on the order. `null` when empty.
        is_tax_included:
          type: boolean
          description: Whether the line prices already include tax. When `true`, each line's tax is the tax part inside its `amount`; when `false`, tax is added on top.
        is_paid:
          type: boolean
          description: Whether the order is paid. A paid order goes into the warehouse flow (picking, packing, shipping).
        is_canceled:
          type: boolean
          description: Whether the order is canceled.
        cancel_reason:
          type:
            - string
            - "null"
          description: Reason the order was canceled. When the first line has its own cancel reason, that one is returned. `null` when there is no reason.
        channel_status:
          type:
            - string
            - "null"
          description: Order status code of the channel as stored on the order, e.g. `Paid` or `Pending` for manual orders. `GET /finance/sales-orders` returns the display name of the same status, which can be spelled differently.
        wms_status:
          type:
            - string
            - "null"
          description: Warehouse step of the order, e.g. `PROCESS`, `PICK`, `FINISH_PICK`, `PACK`, `FINISH_PACK`, `READY_TO_SHIP`, `SHIPPED` or `COMPLETED`. `null` when the order has no warehouse status yet.
        invoice_id:
          type:
            - integer
            - "null"
          description: ID of the invoice made from this order (the invoice whose `ref_no` is this order number). See `GET /finance/invoices/{id}`. `null` when the order is not invoiced yet.
        invoice_no:
          type:
            - string
            - "null"
          description: Number of the invoice made from this order. `null` when the order is not invoiced yet.
        shipping:
          $ref: "#/components/schemas/SalesOrderShipping"
        courier:
          type:
            - string
            - "null"
          description: Courier of the order, e.g. `JNE REG`. `null` when no courier is set.
        tracking_no:
          type:
            - string
            - "null"
          description: Tracking number (air waybill) of the shipment. `null` when not known yet.
        is_cod:
          type: boolean
          description: Whether the order is cash on delivery. Always `false` for orders created through the API.
        sub_total:
          type: number
          description: Sum of `qty` x `price` over all lines, before discounts and tax.
        total_disc:
          type: number
          description: Sum of the line discounts (`lines[].disc_amount`). Does not include `add_disc`.
        add_disc:
          type: number
          description: Extra discount amount for the whole order, split over the lines in proportion to their value. Already taken off each line's `amount`.
        total_tax:
          type: number
          description: Sum of the line tax amounts (`lines[].tax_amount`).
        shipping_cost:
          type: number
          description: Shipping cost of the order, added to `grand_total`.
        shipping_cost_discount:
          type: number
          description: Discount on the shipping cost, subtracted from `grand_total`.
        insurance_cost:
          type: number
          description: Shipping insurance cost, added to `grand_total`.
        service_fee:
          type: number
          description: Service fee, subtracted from `grand_total`.
        order_processing_fee:
          type: number
          description: Order processing fee, subtracted from `grand_total`.
        add_fee:
          type: number
          description: Additional fee, added to `grand_total`.
        cod_fee:
          type: number
          description: Cash on delivery fee. `cod_fee` minus `cod_fee_discount` (not below 0) is added to `grand_total`. `0` for orders created through the API.
        cod_fee_discount:
          type: number
          description: Discount on `cod_fee`. `0` for orders created through the API.
        loyalty_discount:
          type: number
          description: Loyalty discount, subtracted from `grand_total`. `0` when there is none.
        add_cost:
          type: number
          description: Sum of `add_costs[].amount`, added to `grand_total`. `0` when the order has no extra costs.
        grand_total:
          type: number
          description: "Total amount of the order, calculated like the order editor in Jubelio: the line amounts without tax, plus `total_tax`, `insurance_cost`, `shipping_cost` minus `shipping_cost_discount`, `add_fee`, `cod_fee` minus `cod_fee_discount` and `add_cost`, minus `service_fee`, `order_processing_fee` and `loyalty_discount`."
        add_costs:
          description: Extra costs of the order. Their sum is `add_cost`. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              add_cost_setting_id:
                type: integer
                description: ID of the extra cost setting (the cost type set up in Jubelio).
              cost_name:
                type: string
                description: Name of the extra cost setting.
              account_id:
                type: integer
                description: ID of the account the cost is booked to, copied from the extra cost setting when the order was saved. See `GET /finance/accounts`.
              amount:
                type: number
                description: Amount of the extra cost.
              description:
                type:
                  - string
                  - "null"
                description: Note on the extra cost. `null` when empty.
        attachments:
          description: Files attached to the order. Empty when there are none.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: Name of the attached file.
              url:
                type: string
                description: URL of the attached file.
        lines:
          description: Lines of the order, in the order they were added.
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderLine"
        created_at:
          type: string
          format: date-time
          description: When the order was created in Jubelio.
        last_modified:
          type:
            - string
            - "null"
          format: date-time
          description: When the order was last changed.
    SalesOrderCreate:
      type: object
      required:
        - contact_id
        - location_id
        - lines
      description: Send exactly one of store_id and channel_id.
      properties:
        contact_id:
          type: integer
          description: Contact ID of the customer. See `GET /finance/customer-contacts`. Required; rejected with `customer_not_found` when it is not a customer.
        store_id:
          type: integer
          description: ID of an active internal store (channel INTERNAL); the order gets channel `1`. Internal stores can have negative IDs. Send `store_id` or `channel_id`, not both.
        channel_id:
          type: integer
          minimum: 1
          description: ID of a sales channel that has no store, for manual orders of channels not connected to Jubelio. INTERNAL (`1`) and channels with a store are rejected with `channel_not_allowed`. Send `store_id` or `channel_id`, not both.
        location_id:
          type: integer
          description: ID of the location the stock is taken from. See `GET /locations`. Required.
        transaction_date:
          type: string
          format: date-time
          description: Date of the order. Defaults to the current time when omitted.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax. Default `false`.
        is_paid:
          type: boolean
          default: false
          description: Whether the order is already paid. A paid order goes straight into the warehouse flow (picking, packing, shipping). Default `false`.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Note on the order. HTML tags are removed.
        ref_no:
          type:
            - string
            - "null"
          maxLength: 100
          description: Free reference number, e.g. a number from another system. HTML tags are removed.
        salesmen_id:
          type: integer
          description: ID of the salesperson of the order. Optional; rejected with `salesmen_not_found` when it does not exist.
        shipping:
          type: object
          description: Each field defaults to the customer's contact.
          properties:
            full_name:
              type:
                - string
                - "null"
              maxLength: 100
              description: Name of the recipient. Defaults to the customer's name when omitted or `null`.
            phone:
              type:
                - string
                - "null"
              maxLength: 30
              description: Phone number of the recipient. Defaults to the customer's phone when omitted or `null`.
            address:
              type:
                - string
                - "null"
              maxLength: 500
              description: Shipping address. Defaults to the customer's shipping address, or the billing address when there is none, when omitted or `null`.
            subdistrict_id:
              type: string
              maxLength: 20
              description: ID of the subdistrict. See `GET /regions` with `level=subdistrict`. Sets the subdistrict, district, city and province together. Defaults to the region of the customer's shipping address; rejected with `region_not_found` when it does not exist.
            post_code:
              type:
                - string
                - "null"
              maxLength: 10
              description: Post code of the shipping address. Defaults to the post code of the customer's shipping address when omitted or `null`; it is not derived from `subdistrict_id`.
        courier:
          type: string
          maxLength: 100
          description: Courier name from Jubelio's internal courier list, e.g. `JNE REG`. Rejected with `courier_not_found` when it is not in the list.
        tracking_no:
          type: string
          maxLength: 100
          description: Tracking number (air waybill) of the shipment, when already known.
        attachments:
          description: Files to attach to the order, given as links. Default none.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: Name of the file. Required.
              url:
                type: string
                maxLength: 1000
                description: URL of the file. Jubelio stores the link; the file is not uploaded. Required.
        add_disc:
          type: number
          minimum: 0
          default: 0
          description: Extra discount amount for the whole order, split over the lines in proportion to `qty` x `price`. A line never goes below 0; what does not fit moves to the other lines. Default `0`.
        shipping_cost:
          type: number
          minimum: 0
          default: 0
          description: Shipping cost of the order, added to `grand_total`. Default `0`.
        shipping_cost_discount:
          type: number
          minimum: 0
          default: 0
          description: Discount on the shipping cost, subtracted from `grand_total`. Default `0`.
        insurance_cost:
          type: number
          minimum: 0
          default: 0
          description: Shipping insurance cost, added to `grand_total`. Default `0`.
        service_fee:
          type: number
          minimum: 0
          default: 0
          description: Service fee, subtracted from `grand_total`. Default `0`.
        order_processing_fee:
          type: number
          minimum: 0
          default: 0
          description: Order processing fee, subtracted from `grand_total`. Default `0`.
        add_fee:
          type: number
          minimum: 0
          default: 0
          description: Additional fee, added to `grand_total`. Default `0`.
        loyalty_discount:
          type: number
          minimum: 0
          default: 0
          description: Loyalty discount, subtracted from `grand_total`. Default `0`.
        add_costs:
          description: Extra costs of the order. Their sum is added to `grand_total`. Default none.
          type: array
          items:
            type: object
            required:
              - add_cost_setting_id
              - amount
            properties:
              add_cost_setting_id:
                type: integer
                minimum: 1
                description: ID of the extra cost setting (the cost type set up in Jubelio); its account is used for the cost. Required; rejected with `add_cost_setting_not_found` when it does not exist.
              amount:
                type: number
                minimum: 0
                description: Amount of the extra cost. Required.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Note on the extra cost. HTML tags are removed.
        lines:
          description: Lines of the order. At least one line is required.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item_id
              - qty
              - price
            description: Send disc or disc_amount, not both.
            properties:
              item_id:
                type: integer
                minimum: 1
                description: ID of the item (the `sku_id` in `GET /catalog/products`). A bundle item must have a bill of materials. Required.
              qty:
                type: number
                minimum: 1
                description: Quantity ordered, in the item's selling unit. Required.
              price:
                type: number
                minimum: 0
                description: Unit price. Required.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Line discount in percent of `qty` x `price`. Send `disc` or `disc_amount`, not both.
              disc_amount:
                type: number
                minimum: 0
                description: Line discount as an amount. Send `disc` or `disc_amount`, not both.
              tax_id:
                type: integer
                description: ID of the tax. See `GET /finance/taxes`. System taxes have negative IDs, e.g. `-2` PPN 11%. Defaults to the item's sales tax, or tax `1` when the item has none.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the item name when omitted or empty. HTML tags are removed.
              is_free_gift:
                type: boolean
                default: false
                description: Whether the line is a free gift. Default `false`.
              promotion_id:
                type: integer
                minimum: 1
                description: ID of the promotion the line belongs to. Rejected with `promotion_not_found` when it does not exist.
    SalesOrderEscrow:
      type: object
      properties:
        salesorder_id:
          type: integer
          example: 284730
          description: ID of the sales order.
        salesorder_no:
          type: string
          description: Order number shown in Jubelio.
        source:
          type: integer
          description: Channel id, e.g. 64 Shopee, 4 Lazada, 131076 TikTok Shop, 128 Tokopedia.
          example: 64
        source_name:
          type: string
          example: SHOPEE
          description: Name of the sales channel, e.g. `SHOPEE`.
        escrow_amount:
          type: number
          description: Escrow amount stored on the order.
          example: 1840
        escrow_list:
          description: Escrow data from the marketplace; shape depends on source (see the endpoint). Null when not received yet.
          example:
            escrow_amount: 1840
            commission_fee: 160
            voucher_from_seller: 500
            actual_shipping_fee: 5100
            shopee_shipping_rebate: 5100
            buyer_total_amount: 3900
    PurchaseOrderSummary:
      type: object
      properties:
        purchaseorder_id:
          type: integer
          description: ID of the purchase order. Use it with `GET /finance/purchase-orders/{id}`.
        purchaseorder_no:
          type: string
          example: PO-000001234
          description: Purchase order number.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the purchase order.
        contact_id:
          type: integer
          description: ID of the supplier the goods are ordered from. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, as saved on the order.
        location_name:
          type:
            - string
            - "null"
          description: Name of the location the goods are ordered for. `null` when it cannot be found.
        grand_total:
          type: number
          description: "Total of the order: line amounts after discount and before tax, plus tax."
        status:
          type: string
          enum:
            - active
            - closed
          description: "`active` while the order is open. `closed` when the merchant closed it in Jubelio; no more bills can then be made from it."
        note:
          type:
            - string
            - "null"
          description: Note on the order. `null` when empty.
        ref_no:
          type:
            - string
            - "null"
          description: Free reference number on the order. `null` when none was entered.
        bill_numbers:
          type: array
          items:
            type: string
          description: Bills made from the order.
    PurchaseOrderLine:
      type: object
      properties:
        purchaseorder_detail_id:
          type: integer
          description: ID of the order line. Bill lines made from it refer to it in `purchaseorder_detail_id`.
        item_id:
          type: integer
          description: ID of the item (SKU), the same as `sku_id` in `GET /catalog/products`.
        item_code:
          type: string
          description: Code (SKU) of the item.
        item_name:
          type: string
          description: Name of the item.
        description:
          type:
            - string
            - "null"
          description: Text of the line. For orders created through the API, the `description` that was sent, or else the item name. `null` when empty.
        qty:
          type: number
          description: Quantity ordered, in `unit`. `price` is per `unit`.
        unit:
          type:
            - string
            - "null"
          description: Unit the item is ordered in. For orders created through the API, the item's purchase unit.
        price:
          type: number
          description: Unit price before discount. Includes tax when the order's `is_tax_included` is `true`.
        disc:
          type: number
          description: Line discount, in percent.
        disc_amount:
          type: number
          description: "Line discount as an amount. Matches `disc`: `qty` x `price` x `disc` / 100."
        tax_id:
          type: integer
          description: ID of the tax on the line. See `GET /finance/taxes`.
        tax_name:
          type:
            - string
            - "null"
          description: Name of the tax on the line.
        tax_amount:
          type: number
          description: Tax on the line. When `is_tax_included` is `true`, the part of `amount` that is tax; otherwise `amount` x the tax rate / 100.
        amount:
          type: number
          description: "Line amount: `qty` x `price` minus `disc_amount`. It includes tax only when the order's `is_tax_included` is `true`."
    PurchaseOrder:
      type: object
      properties:
        purchaseorder_id:
          type: integer
          description: ID of the purchase order.
        purchaseorder_no:
          type: string
          description: Purchase order number.
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the purchase order.
        contact_id:
          type: integer
          description: ID of the supplier the goods are ordered from. See `GET /finance/supplier-contacts`.
        supplier_name:
          type: string
          description: Name of the supplier, as saved on the order.
        location_id:
          type: integer
          description: ID of the location the goods are ordered for. See `GET /locations`.
        location_name:
          type: string
          description: Name of the location the goods are ordered for.
        payment_term:
          type:
            - integer
            - "null"
          description: Payment term of the order, in days. `null` when none is set.
        is_tax_included:
          type: boolean
          description: Whether the line prices already include tax.
        note:
          type:
            - string
            - "null"
          description: Note on the order. `null` when empty.
        ref_no:
          type:
            - string
            - "null"
          description: Free reference number on the order. `null` when none was entered.
        status:
          type: string
          enum:
            - active
            - closed
          description: "`active` while the order is open. `closed` when the merchant closed it in Jubelio; no more bills can then be made from it."
        close_reason:
          type:
            - string
            - "null"
          description: Reason entered when the order was closed in Jubelio. `null` when the order is active or no reason was given.
        sub_total:
          type: number
          description: Sum of `qty` x `price` over all lines, before discount and tax.
        total_disc:
          type: number
          description: Sum of the line discounts (`disc_amount`).
        total_tax:
          type: number
          description: Sum of the line taxes (`tax_amount`).
        grand_total:
          type: number
          description: "Total of the order: line amounts after discount and before tax, plus tax. There is no order-level discount or fee."
        attachments:
          description: Files attached to the order.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: Name of the file.
              url:
                type: string
                description: URL where the file can be downloaded.
        lines:
          description: Items on the order.
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderLine"
        created_at:
          type: string
          format: date-time
          description: When the order was created in Jubelio.
        last_modified:
          type:
            - string
            - "null"
          format: date-time
          description: When the order was last changed.
    PurchaseOrderCreate:
      type: object
      required:
        - contact_id
        - location_id
        - lines
      properties:
        contact_id:
          type: integer
          description: ID of the supplier the goods are ordered from. See `GET /finance/supplier-contacts`. Required; an unknown supplier fails with `supplier_not_found`.
        location_id:
          type: integer
          description: ID of the location the goods are ordered for. See `GET /locations`. Required.
        transaction_date:
          type: string
          format: date-time
          description: Defaults to now.
        payment_term:
          type: integer
          minimum: 0
          description: Payment term of the order, in days. Optional; defaults to the supplier's payment term. 0 is allowed.
        is_tax_included:
          type: boolean
          default: false
          description: Whether `price` already includes tax. Optional; defaults to `false`.
        note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Note on the order. Optional. HTML tags are removed.
        ref_no:
          type:
            - string
            - "null"
          maxLength: 100
          description: Free reference number for the order. Optional. HTML tags are removed.
        attachments:
          description: Files to attach to the order, given by URL. Optional.
          type: array
          items:
            type: object
            required:
              - file_name
              - url
            properties:
              file_name:
                type: string
                maxLength: 250
                description: Name of the file as shown in Jubelio. Required.
              url:
                type: string
                maxLength: 1000
                description: URL where the file can be downloaded. Required.
        lines:
          description: Items to order. At least one line is required.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - item_id
              - qty
              - price
            description: Send disc or disc_amount, not both.
            properties:
              item_id:
                type: integer
                minimum: 1
                description: ID of the item (SKU) to order, the same as `sku_id` in `GET /catalog/products`. Required. The item must be buyable and not a bundle, archived or a consignment item, otherwise the request fails with `item_not_purchasable`.
              qty:
                type: number
                minimum: 1
                description: Quantity to order, at least 1. Required. The line unit is the item's purchase unit.
              price:
                type: number
                minimum: 0
                description: Unit price before discount. Required. It includes tax when `is_tax_included` is `true`.
              disc:
                type: number
                minimum: 0
                maximum: 100
                description: Line discount, in percent. Optional. Send `disc` or `disc_amount`, not both.
              disc_amount:
                type: number
                minimum: 0
                description: Line discount as a fixed amount. Optional. Send `disc` or `disc_amount`, not both.
              tax_id:
                type: integer
                description: ID of the tax on the line. See `GET /finance/taxes`; built-in taxes have negative IDs, for example -2 for PPN 11%. Optional; defaults to the item's purchase tax, or No Tax (ID 1) when the item has none.
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                description: Description of the line. Defaults to the item name when omitted or empty. HTML tags are removed.
    AssetSummary:
      type: object
      properties:
        asset_id:
          type: integer
          description: ID of the fixed asset. Use it with `GET /finance/assets/{id}`.
        asset_code:
          type: string
          description: Code of the asset.
        asset_name:
          type: string
          description: Name of the asset.
        category_name:
          type: string
          description: Name of the asset category.
        status:
          type: string
          enum:
            - active
            - inactive
          description: "`active` for an asset in use; `inactive` when the asset was set inactive in Jubelio."
    AssetAccount:
      type:
        - object
        - "null"
      properties:
        account_id:
          type: integer
          description: ID of the account. See `GET /finance/accounts/{id}`.
        account_code:
          type: string
          description: Code of the account.
        account_name:
          type: string
          description: Name of the account.
    Asset:
      type: object
      properties:
        asset_id:
          type: integer
          description: ID of the fixed asset.
        asset_code:
          type: string
          description: Code of the asset.
        asset_name:
          type: string
          description: Name of the asset.
        status:
          type: string
          enum:
            - active
            - inactive
          description: "`active` for an asset in use; `inactive` when the asset was set inactive in Jubelio."
        category:
          description: Asset category the asset belongs to.
          type: object
          properties:
            category_id:
              type: integer
              description: ID of the asset category.
            category_code:
              type: string
              description: Code of the asset category.
            category_name:
              type: string
              description: Name of the asset category.
        buy_date:
          type: string
          format: date-time
          description: Date the asset was bought.
        use_date:
          type: string
          format: date-time
          description: Date the asset was first put into use. Depreciation starts in this month or the month after, see `depreciation_start`.
        qty:
          type: integer
          description: Number of units of the asset.
        acquisition_cost:
          type: number
          description: Amount the asset was bought for. Depreciation and `book_value` are worked out from this amount as a whole, not per unit of `qty`.
        residual_value:
          type: number
          description: Value the asset is expected to keep at the end of its life. Each month `acquisition_cost` minus this value, divided by `depreciable_life`, is depreciated.
        supplier_id:
          type:
            - integer
            - "null"
          description: ID of the supplier the asset was bought from. See `GET /finance/supplier-contacts`. `null` when no supplier is set.
        supplier_name:
          type:
            - string
            - "null"
          description: Name of the supplier the asset was bought from. `null` when no supplier is set.
        asset_account:
          $ref: "#/components/schemas/AssetAccount"
        payment_account:
          $ref: "#/components/schemas/AssetAccount"
        notes:
          type:
            - string
            - "null"
          description: Notes on the asset. `null` when empty.
        is_depreciated:
          type: boolean
          description: Whether the asset is depreciated. When `false`, `depreciation_method` is `null` and `GET /finance/assets/{id}/depreciations` returns an empty list.
        depreciation_method:
          type:
            - string
            - "null"
          enum:
            - straight_line
            - null
          description: How the asset is depreciated. `straight_line` (the same amount every month) is the only method in Jubelio. `null` when `is_depreciated` is `false`.
        depreciation_start:
          type: string
          enum:
            - this_month
            - next_month
          description: "Month depreciation starts in: `this_month` is the month of `use_date`, `next_month` is the month after."
        depreciable_life:
          type:
            - integer
            - "null"
          description: Depreciable life of the asset, in months. `null` when the asset is not depreciated.
        depreciation_rate:
          type:
            - number
            - "null"
          description: "% per year: 12 / depreciable_life x 100."
        depreciation_account:
          $ref: "#/components/schemas/AssetAccount"
        accumulated_depreciation_account:
          $ref: "#/components/schemas/AssetAccount"
        accumulated_depreciation:
          type: number
          description: Sum of the depreciation journals so far.
        book_value:
          type: number
          description: "`acquisition_cost` minus `accumulated_depreciation`, as on the asset page in Jubelio."
        payment_id:
          type:
            - integer
            - "null"
          description: Payment booked when the asset was bought.
        journal_id:
          type:
            - integer
            - "null"
          description: ID of the journal booked when the asset was bought. See `GET /finance/journals/{id}`. `null` when there is none.
        attachments:
          description: Files attached to the asset.
          type: array
          items:
            type: object
            properties:
              file_name:
                type: string
                description: Name of the file.
              url:
                type: string
                description: URL where the file can be downloaded.
    AssetDepreciation:
      type: object
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Date of the depreciation journal for the month. For a month with no journal yet, the last day of that month.
        journal_id:
          type:
            - integer
            - "null"
          description: ID of the depreciation journal booked for the month. See `GET /finance/journals/{id}`. `null` when the month has no depreciation journal yet.
        journal_no:
          type:
            - string
            - "null"
          example: GJ-000001234
          description: Number of the depreciation journal, made from the journal prefix in the merchant settings (default `GJ`) and `journal_id`. `null` when the month has no depreciation journal yet.
        amount:
          type:
            - number
            - "null"
          description: "Amount depreciated in the month: the total debit of the depreciation journal. `null` when the month has no depreciation journal yet."
    ActionResult:
      type: object
      description: Generic result for write endpoints that don't return a resource.
      properties:
        status:
          type: string
          enum:
            - ok
    AccountSummary:
      type: object
      properties:
        account_id:
