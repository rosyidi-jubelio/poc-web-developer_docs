        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the journal.
        source_doc_no:
          type:
            - string
            - "null"
          description: Number of the source document, e.g. an invoice number. `Manual Jurnal` for manual journals.
        notes:
          type:
            - string
            - "null"
          description: Notes on the journal.
        lines:
          description: Journal lines.
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
    JournalCreate:
      type: object
      required:
        - transaction_date
        - lines
      properties:
        transaction_date:
          type: string
          format: date-time
          description: Transaction date of the journal. Required.
        notes:
          type:
            - string
            - "null"
          maxLength: 500
          description: Notes on the journal. HTML tags are removed.
        lines:
          description: Journal lines. At least two are required, and total `debit` must equal total `credit` (`journal_not_balanced`).
          type: array
          minItems: 2
          items:
            type: object
            required:
              - account_id
            properties:
              account_id:
                type: integer
                minimum: 1
                description: ID of the account to post to. Required. See `GET /finance/accounts`. An unknown ID returns `account_not_found`.
              description:
                type:
                  - string
                  - "null"
                maxLength: 250
                description: Description of the line. HTML tags are removed.
              debit:
                type: number
                minimum: 0
                default: 0
                description: Debit amount. Defaults to `0`. Each line has an amount above 0 in exactly one of `debit` and `credit` (`journal_line_invalid`).
              credit:
                type: number
                minimum: 0
                default: 0
                description: Credit amount. Defaults to `0`. Each line has an amount above 0 in exactly one of `debit` and `credit` (`journal_line_invalid`).
