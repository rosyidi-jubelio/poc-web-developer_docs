  /finance/invoices:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List invoices
      description: |
        Sales invoices, newest transaction date first. Requires scope
        `finance.invoice.read`.
      operationId: listInvoices
      x-scope: finance.invoice.read
      parameters:
        - name: q
          in: query
          description: Search invoice number, customer name or reference number. Minimum 3 characters.
          schema:
            type: string
            minLength: 3
        - name: status
          in: query
          description: "Payment status filter. `paid`: nothing left to pay. `unpaid`: an amount is still due, overdue invoices included. `overdue`: an amount is still due and `due_date` is today or earlier. Repeat the parameter to match several (`status=paid&status=overdue`)."
          schema:
            type: array
            items:
              type: string
              enum:
                - paid
                - unpaid
                - overdue
          style: form
          explode: true
        - name: contact_id
          in: query
          description: Only invoices of this customer contact. See `GET /finance/customer-contacts`.
          schema:
            type: integer
            minimum: 1
        - name: transaction_date_from
          in: query
          description: Only invoices with `transaction_date` after this time (exclusive, ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only invoices with `transaction_date` at or before this time (inclusive, ISO 8601).
          schema:
            type: string
            format: date-time
        - name: last_modified_since
          in: query
          description: Only invoices changed at or after this time (ISO 8601). Use for incremental sync.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Invoices on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/InvoiceSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create an invoice
      description: |
        Creates a sales invoice with an automatic invoice number. Send
        quantities, prices and discounts only: line amounts, tax, totals and
        cost of goods sold are calculated by Jubelio, the same way as when the
        merchant creates the invoice in Jubelio. Payment cannot be recorded
        while creating the invoice. Invoices cannot be updated or deleted
        through the API. Requires scope `finance.invoice.create`.

        How amounts are calculated:
        - Line gross = `price` x `qty`. `disc` is a percentage of gross;
          `disc_amount` is a fixed amount. Send one of them, not both.
        - `add_disc` is spread over the lines in proportion to their gross.
        - Tax per line uses the rate of `tax_id` (default: the item's sales
          tax). With `is_tax_included` the tax is taken out of the line
          amount; otherwise it is added on top.
        - `grand_total` = amount before tax + tax + `insurance_cost` +
          (`shipping_cost` - `shipping_cost_discount`) + `add_fee` -
          `service_fee` - `order_processing_fee` +
          max(0, `cod_fee` - `cod_fee_discount`) - `loyalty_discount` +
          sum of `add_costs`.

        Errors (`400`): `validation_error`, `customer_not_found`,
        `location_not_found`, `item_not_found`, `tax_not_found`,
        `bin_not_found`, `promotion_not_found`, `add_cost_setting_not_found`,
        `salesmen_not_found`, `tag_not_found`, `channel_not_found`,
        `store_not_found`, `store_channel_mismatch`, `cod_not_allowed`,
        `invoice_total_negative`, `request_rejected` (rejected by an
        invoice rule in Jubelio, e.g. stock or serial/batch number checks).
      operationId: createInvoice
      x-scope: finance.invoice.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
            example:
              contact_id: 1203
              transaction_date: 2026-11-17T09:00:00+07:00
              due_date: 2026-12-17T00:00:00+07:00
              location_id: 1
              is_tax_included: false
              note: Order via partner app
              add_disc: 5000
              shipping_cost: 18000
              lines:
                - item_id: 2210
                  qty: 2
                  price: 75000
                  disc: 10
                  tax_id: 2
                - item_id: 2214
                  qty: 1
                  price: 120000
      responses:
        "201":
          description: Created. Returns the invoice as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
