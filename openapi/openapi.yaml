        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Purchase orders on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/PurchaseOrderSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a purchase order
      description: |
        Creates a purchase order with an automatic PO number, like the
        purchase order editor in Jubelio. Orders cannot be updated, closed or
        deleted through the API. Requires scope `finance.purchase_order.create`.

        **Amounts are calculated by Jubelio**: each line is `qty x price`
        minus its discount (`disc` % or `disc_amount`), tax follows
        `is_tax_included`, and `grand_total` = lines before tax + tax. It must
        be greater than 0.

        Items must be buyable and not a bundle, archived or a consignment
        item. Each line defaults to the item's purchase unit, purchase tax
        (or "No Tax") and name. `payment_term` defaults to the supplier's.

        Errors (`400`): `validation_error`, `supplier_not_found`,
        `location_not_found`, `item_not_found`, `item_not_purchasable`,
        `tax_not_found`, `order_total_zero`, `request_rejected`.
      operationId: createPurchaseOrder
