  /finance/journals:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List journals
      description: |
        General ledger journals, newest transaction date first. Includes manual
        journals and the journals Jubelio posts automatically for invoices,
        bills, payments, returns and adjustments (`transaction_type` says which).
        Requires scope `finance.journal.read`.
      operationId: listJournals
      x-scope: finance.journal.read
      parameters:
        - name: journal_type
          in: query
          description: "`manual` for journals entered by hand, `auto` for journals posted by transactions. Omit to get both."
          schema:
            type: string
            enum:
              - manual
              - auto
        - name: transaction_date_from
          in: query
          description: Only journals with `transaction_date` at or after this time (inclusive, ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only journals with `transaction_date` at or before this time (inclusive, ISO 8601).
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Journals on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/JournalSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a manual journal
      description: |
        Posts a manual journal. Every line carries either `debit` or `credit`
        (not both), and total debit must equal total credit. Journals cannot be
        updated or deleted through the API; corrections are made by the
        merchant in Jubelio. Requires scope `finance.journal.create`.

        Errors (`400`): `journal_not_balanced`, `journal_line_invalid`,
        `account_not_found`, `validation_error`.
      operationId: createJournal
      x-scope: finance.journal.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCreate"
            example:
              transaction_date: 2026-11-10T00:00:00Z
              notes: Biaya admin bank November
              lines:
                - account_id: 48
                  description: Biaya admin
                  debit: 15000
                - account_id: 114
                  description: BNI 8876
                  credit: 15000
      responses:
        "201":
          description: Created. Returns the journal as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Journal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /finance/journals/{id}:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: Get a journal
      description: A journal with its lines, manual or automatic. Requires scope `finance.journal.read`.
      operationId: getJournal
      x-scope: finance.journal.read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID of the journal (`journal_id`). See `GET /finance/journals`.
      responses:
