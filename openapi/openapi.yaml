components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token obtained from `POST /oauth/token`. Send it as
        `Authorization: Bearer <token>` on every gateway request, together
        with the `x-jbl-merchant-id` header naming the merchant the token was
        issued for. A token
        only authorizes the scopes the merchant approved at install; a call
        outside those scopes gets `403` with `error.code: endpoint_not_authorized`.
  parameters:
    JblMerchantId:
      name: x-jbl-merchant-id
      in: header
      required: true
      description: |
        The merchant this call acts on. Send the `merchant_id` that came back
        with the access token from `POST /oauth/token`. A request without it
        gets `400` with `missing_merchant`; a merchant other than the token's
        gets `401`.
      schema:
        $ref: "#/components/schemas/MerchantId"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Q:
      name: q
      in: query
      description: Case-insensitive search text. Empty string matches everything.
      schema:
        type: string
        default: ""
    CategoryId:
      name: category_id
      in: path
      required: true
      description: Jubelio category id
      schema:
        type: integer
        minimum: 1
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ChannelId"
    ProductId:
      name: product_id
      in: path
      required: true
      description: Product id
      schema:
        type: integer
        minimum: 1
        example: 101
    AdjustmentId:
      name: adjustment_id
      in: path
      required: true
      description: Price adjustment id
      schema:
        type: integer
        minimum: 1
        example: 120
  responses:
    BadRequest:
      description: |
        The request body, query, or path failed validation, or the
        `x-jbl-merchant-id` header is missing (`missing_merchant`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: bad_request
              message: grant_type is required
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    Unauthorized:
      description: |
        The access token is missing, malformed, expired, or has been
        revoked (for example, the app was uninstalled), or `x-jbl-merchant-id`
        names a merchant other than the one the token was issued for.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: unauthorized
              message: token_expired
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    NotFound:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: location_not_found
              message: location_not_found
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    Forbidden:
      description: |
        The token is valid but was not granted the scope this endpoint
        requires.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: endpoint_not_authorized
              message: "endpoint_not_authorized: this endpoint is not authorized for the current access token (requires scope: product.read)"
            request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
    ValidationError:
      description: |
        Request validation failed.
        Error code: `validation_error`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: validation_error
              message: '"page_size" must be less than or equal to 100'
            request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
    InternalError:
      description: |
        Unexpected server error. The message is generic.
        Error code: `internal_error`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryNotFound:
      description: |
        Category does not exist.
        Error code: `category_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryMappingNotFound:
      description: |
        The category is not mapped to this channel yet. Map it first with
        `POST /catalog/categories/mappings`.
        Error code: `category_mapping_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CustomCategoryDisabled:
      description: |
        The merchant uses Jubelio's default category tree, which cannot be changed.
        Write endpoints are only available when custom categories are enabled.
        Error code: `custom_category_disabled`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProductNotFound:
      description: |
        Product does not exist.
        Error code: `product_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProductValidationFailed:
      description: |
        Business validation failed. `message` carries the reason.
        Error code: `product_validation_failed`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            data: null
            meta: null
            error:
              code: product_validation_failed
              message: "product_validation_failed: SKU KAOS-M sudah digunakan"
            request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
    ProductRejected:
      description: |
        Request validation failed (`validation_error`) or the product was rejected (`product_rejected`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BarcodeTaken:
      description: |
        A barcode is already used by another SKU.
        Error code: `barcode_taken`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AdjustmentNotFound:
      description: |
        Price adjustment does not exist.
        Error code: `adjustment_not_found`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  headers:
    XRequestId:
      description: |
        Correlation ID for this request, a UUID generated fresh per request.
        Matches the `request_id` field in the response body.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Lowercase snake_case identifier.
        message:
          type: string
          description: Human-readable detail, for debugging only.
    Envelope:
      type: object
      title: Success envelope
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          description: The payload. An object for a single resource, an array for a list.
        meta:
          type: "null"
          description: null for non-paginated endpoints.
        error:
          type: "null"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    PaginatedEnvelope:
      type: object
      title: Success envelope (paginated)
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          type: array
        meta:
          type: object
          required:
            - page
            - page_size
          properties:
            page:
              type: integer
            page_size:
              type: integer
        error:
          type: "null"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    ErrorEnvelope:
      type: object
      title: Error envelope
      required:
        - data
        - meta
        - error
        - request_id
      properties:
        data:
          type: "null"
        meta:
          type: "null"
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          type: string
          format: uuid
          description: Also returned in the `X-Request-ID` response header.
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
            - refresh_token
        code:
          type: string
          description: Required when grant_type is authorization_code. Single-use.
        redirect_uri:
          type: string
          format: uri
          description: Required when grant_type is authorization_code. Must match the URI used to start the flow.
        refresh_token:
          type: string
          description: Required when grant_type is refresh_token.
        client_id:
          type: string
        client_secret:
          type: string
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Present for standalone apps. Absent for embedded token flows.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        merchant_id:
          $ref: "#/components/schemas/MerchantId"
        scopes:
          type: array
          items:
            type: string
          description: The scope codes the merchant granted.
    MerchantId:
      type: string
      description: The merchant your app acts on. You receive it with the access token from `POST /oauth/token`.
      example: 7K2QX9M4BDH3
    MerchantProfile:
      type: object
      properties:
        merchant_id:
          $ref: "#/components/schemas/MerchantId"
        company_name:
          type: string
          description: The merchant's company name as recorded when it installed the app.
        subscription:
          oneOf:
            - $ref: "#/components/schemas/AppSubscription"
            - type: "null"
          description: The merchant's subscription to the calling app. `null` for a free app.
    AppSubscription:
      type: object
      properties:
        status:
          type: string
          enum:
            - trial
            - active
            - over_due
            - expired
          description: |
            - `trial`: inside the 7 day trial that started at install.
            - `active`: a paid period is running.
            - `over_due`: a paid period ended without renewal, inside the 7 day grace period.
            - `expired`: the trial ended unpaid, or the grace period ran out.
        plan:
          type: object
          description: The plan the merchant is on, as defined by the developer in Dev Console.
          properties:
            plan_id:
              type: integer
            name:
              type: string
        billing_cycle:
          type:
            - string
            - "null"
          enum:
            - monthly
            - yearly
            - null
          description: "`null` until the merchant pays for a first period."
        trial_ends_at:
          type:
            - string
            - "null"
