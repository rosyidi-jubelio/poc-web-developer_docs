  /catalog/products:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Products
      summary: List products
      description: |
        Paginated list of products, newest change first (`last_modified` descending).
        `status` selects the product list:

        | status | products |
        |---|---|
        | `active` | catalog (master) products, not archived |
        | `need_review` | products pulled from a channel that are not part of the catalog yet |
        | `in_review` | products currently in review |
        | `archived` | archived products |
      operationId: listProducts
      x-scope: product.read
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - need_review
              - in_review
              - archived
            default: active
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
        - name: category_id
          in: query
          description: Only products in this Jubelio category
          schema:
            type: integer
            minimum: 1
        - name: is_bundle
          in: query
          description: Only bundle (`true`) or non-bundle (`false`) products
          schema:
            type: boolean
        - name: last_modified_since
          in: query
          description: Only products changed on or after this date (ISO 8601). Useful for periodic sync.
          schema:
            type: string
            format: date
            example: 2026-10-01
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ProductSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Products
      summary: Create product
      description: |
        Creates a product with its images and SKUs. `sell_price` (product and SKUs)
        is the initial price only; prices are changed later through the price API.
      operationId: createProduct
      x-scope: product.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Product created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/ProductRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/BarcodeTaken"
        "422":
          description: |
            Error codes:
            - `category_not_found`: `category_id` does not exist
