  /finance/customer-payments:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Finance
      summary: List customer payments
      description: |
        Payments received from customers against invoices, newest transaction
        date first. Includes payments made by marketplace settlements
        (`settlement_no` is set). Sales order down payments are not included.
        Requires scope `finance.customer_payment.read`.
      operationId: listCustomerPayments
      x-scope: finance.customer_payment.read
      parameters:
        - name: contact_id
          in: query
          description: Only payments of this customer. Contact ID from `GET /finance/customer-contacts`.
          schema:
            type: integer
        - name: transaction_date_from
          in: query
          description: Only payments with a `transaction_date` on or after this time (ISO 8601). A date without a time means the start of that day.
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
          in: query
          description: Only payments with a `transaction_date` on or before this time (ISO 8601). A date without a time means the start of that day, so send the end of the day to include the whole day.
          schema:
            type: string
            format: date-time
        - name: cheque_status
          in: query
          description: "Only cheque payments with this status: `active` for cheques in force, `cancelled` for cheques cancelled in Jubelio."
          schema:
            type: string
            enum:
              - active
              - cancelled
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        description: Customer payments on this page, newest transaction date first.
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomerPaymentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Finance
      summary: Create a customer payment
      description: |
        Records a payment received from a customer for one or more of their
        invoices, with an automatic payment number. Payments cannot be
        updated or deleted through the API.
        Requires scope `finance.customer_payment.create`.

        **Per line** send `invoice_id`. `amount` (paid in cash or bank) and
        `downpayment_amount` (covered by the sales order down payment) are
        optional. By default the available down payment is used first and
        `amount` is the rest of the invoice. When only `amount` is sent, the
        down payment covers what is left after it. `amount` +
        `downpayment_amount` must not exceed what is still owed on the
        invoice.

        **Automatic deductions:** like when the merchant picks an invoice in
        Jubelio, these deductions are added to the line by themselves:
        income tax for items that have a sales income tax (minus what earlier
        payments of the invoice already deducted), and the COD fee of a
        Jubelio Shipment COD order. They show with `is_automatic: true`.

        `adjustments` add (`addition`) or subtract (`deduction`) amounts from
        the cash received, e.g. bank fees, booked to the given account. The
        payment `amount` is the cash received: the sum of each line's
        `amount` + additions - deductions. A line's deductions must not be
        larger than its `amount` plus additions.

        `account_id` is the account the money goes to: a Cash & Bank, other
        current asset, expense or other expense account.

        Errors (`400`): `validation_error`, `customer_not_found`,
        `payment_account_not_found`, `account_not_found`, `tag_not_found`,
        `invoice_not_found` (not an invoice of this customer),
        `invoice_repeated`, `invoice_paid`, `transaction_date_invalid`
        (before an invoice date), `amount_exceeds_due`,
        `downpayment_exceeds_available`, `amount_required`,
        `adjustment_exceeds_amount`, `cheque_number_duplicate`,
        `request_rejected` (rejected by a payment rule in Jubelio).
      operationId: createCustomerPayment
      x-scope: finance.customer_payment.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerPaymentCreate"
            examples:
              fullPayment:
                summary: Pay an invoice in full
                value:
                  contact_id: 180679
                  account_id: 12
                  lines:
                    - invoice_id: 59979
              partialWithFee:
                summary: Partial payment by cheque, with a bank fee
                value:
                  contact_id: 180679
                  account_id: 12
                  transaction_date: 2026-11-17T00:00:00Z
                  cheque:
                    number: CHQ00123
                    date: 2026-11-30
                  lines:
                    - invoice_id: 59979
                      amount: 150000
                      adjustments:
                        - type: deduction
                          account_id: 88
                          amount: 2500
                          description: Bank fee
      responses:
        "201":
          description: Created. Returns the payment as stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CustomerPayment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
