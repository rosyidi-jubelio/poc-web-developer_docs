openapi: 3.1.0
info:
  title: Jubelio Open API
  version: 0.2.0-draft
  description: |
    Public API surface for third-party apps that connect to Jubelio merchant
    data. Every call is authorized by a scoped access token obtained through
    OAuth; a token only grants the scopes the merchant approved when
    installing the app.

    Status: **IN PROGRESS**, filled in per module. The Catalog module
    (Categories, Category Mappings, Channel Categories, Products, Prices) is
    complete. Auth, Merchant Info, Orders, WMS, Finance and Reference are still
    a representative slice that establishes the contract shape.
    Operations marked `x-available: false` are documented but not enabled yet.

    ## Response format

    Every resource endpoint (everything except the OAuth token endpoint)
    wraps its payload in the same envelope:

    ```json
    {
      "data": { },
      "meta": null,
      "error": null,
      "request_id": "3fa4c1e0-...-c1d2e3f4a5b6"
    }
    ```

    - `data` holds the actual payload: an object for a single resource, an
      array for a list.
    - `meta` carries paging info on list endpoints, `null` otherwise.
    - `error` is always `null` on a successful response.
    - `request_id` is a UUID generated fresh per request, also echoed in the
      `X-Request-ID` response header. Include it when reporting a problem.

    Paged list endpoints (those taking `page` and `page_size`) add the page they returned to `meta`:

    ```json
    {
      "data": [ ],
      "meta": { "page": 1, "page_size": 20 },
      "error": null,
      "request_id": "3fa4c1e0-...-c1d2e3f4a5b6"
    }
    ```

    Lists do not report a total. To read every page, request the next `page` until a page
    returns fewer rows than `page_size`.

    On failure, `data` and `meta` are `null` and `error` carries the problem:

    ```json
    {
      "data": null,
      "meta": null,
      "error": { "code": "endpoint_not_authorized", "message": "endpoint_not_authorized: this endpoint is not authorized for the current access token (requires scope: product.read)" },
      "request_id": "3fa4c1e0-...-c1d2e3f4a5b6"
    }
    ```

    - `code` is a lowercase, snake_case identifier. `endpoint_not_authorized` (403)
      and `internal_error` (500) are stable. Catalog endpoints document their
      codes per response and use `validation_error` for every request
      validation failure. Outside Catalog the codes are not yet fixed, so match
      on HTTP status first and treat `code` as a hint.
    - `message` is human-readable, for debugging only. `internal_error` always
      carries a generic message.

    ## Scopes

    Each operation lists its required scope in `x-scope`. Calling an operation
    with a token that lacks the scope returns `403 endpoint_not_authorized`.
    Operations without `x-scope` only need a valid token.

    The OAuth token endpoint is the one exception: it returns a plain OAuth
    2.0 token response, not this envelope (see `POST /oauth/token`).
servers:
  - url: https://poc-open-api.qm-staging-k8s.jubelio.io/openapi/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: OAuth token issuance for standalone apps
  - name: Merchant Info
    description: The installing merchant's own profile and its subscription to the calling app
  - name: Categories
    description: "Catalog: Jubelio product categories (the merchant's category tree)"
  - name: Category Mappings
    description: "Catalog: mapping between Jubelio categories and marketplace categories, including attribute and variation mappings"
  - name: Channel Categories
    description: "Catalog: marketplace category master data (the same for all merchants)"
  - name: Products
    description: "Catalog: products, images and SKUs"
  - name: Prices
    description: "Catalog: online/offline prices, promotions, sync failures and price adjustments"
  - name: WMS
    description: Warehouse, stock location, and inter-warehouse transfer capabilities
  - name: Finance
    description: Invoices and accounting capabilities
  - name: Reference
    description: Shared reference data
paths:
  /oauth/token:
    post:
      tags:
        - Auth
      summary: Exchange an authorization code for an access token
      description: |
        Called by the app's own backend after the merchant approves the
        install and is redirected back with `code`. Also used with
        `grant_type: refresh_token` to mint a new access token without
        repeating the OAuth consent screen.

        This endpoint is unauthenticated (no bearer token); the app
        authenticates itself with `client_id` + `client_secret` in the body.
      operationId: issueAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            examples:
              authorization_code:
                summary: Exchange a fresh authorization code
                value:
                  grant_type: authorization_code
                  code: a1b2c3d4-...-single-use
                  client_id: client_abc123
                  client_secret: shhh
                  redirect_uri: https://app.example.com/oauth/callback
              refresh_token:
                summary: Refresh an expired access token
                value:
                  grant_type: refresh_token
                  refresh_token: eyJhbGciOi...
                  client_id: client_abc123
                  client_secret: shhh
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /merchant:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Merchant Info
      summary: Get the installing merchant's profile and subscription
      description: |
        Returns the profile of the merchant the current access token was
        granted for, together with that merchant's subscription to the
        calling app. There is exactly one merchant per token; this endpoint
        takes no merchant identifier beyond the header, and it needs no scope.

        The subscription is always the calling app's own. An app cannot read
        what the merchant pays for any other app. `subscription` is `null`
        for a free app.

        A subscription that is `expired` blocks the app's tokens, so in
        practice an app reads `trial`, `active` or `over_due`. Use
        `over_due` to ask the merchant to pay before `grace_period_ends_at`.
      operationId: getMerchant
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MerchantProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: |
            Merchant info is temporarily unavailable. Retry later. The endpoint
            fails rather than answering without a subscription, because a
            `null` subscription means a free app.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                meta: null
                error:
                  code: app_store_unavailable
                  message: app_store_unavailable
                request_id: 3fa4c1e0-1234-4a5b-8c6d-c1d2e3f4a5b6
  /catalog/categories:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Categories
      summary: List categories
      description: |
        Paginated list of the merchant's categories, sorted by `full_name` ascending.
      operationId: listCategories
      x-scope: category.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategorySummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Categories
      summary: Create category
      description: |
        Creates a category. Only available for merchants with custom categories
        enabled; otherwise returns `409 custom_category_disabled`.

        The response does not include the new category id. Use
        `GET /catalog/categories?q=<name>` to find it.
      operationId: createCategory
      x-scope: category.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/CustomCategoryDisabled"
        "422":
          description: |
            Parent category does not exist.
            Error code: `parent_category_not_found`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                meta: null
                error:
                  code: parent_category_not_found
                  message: parent_category_not_found
                request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags:
        - Categories
      summary: Get category
      operationId: getCategory
      x-scope: category.read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Categories
      summary: Update category
      description: |
        Full replace: both `category_name` and `parent_id` are required.
        Only available for merchants with custom categories enabled.
      operationId: updateCategory
      x-scope: category.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Category updated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CustomCategoryDisabled"
        "422":
          description: |
            Invalid parent.
            Error codes:
            - `parent_category_not_found`: parent does not exist (`0` = root, always valid)
            - `invalid_parent_category`: parent is the category itself or one of its descendants
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                meta: null
                error:
                  code: invalid_parent_category
                  message: invalid_parent_category
                request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/children:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - name: category_id
        in: path
        required: true
        description: Jubelio category id. Use `0` to list root categories.
        schema:
          type: integer
          minimum: 0
    get:
      tags:
        - Categories
      summary: List direct child categories
      description: |
        Direct children of the category, sorted by name. Not paginated (`meta` is null).
        `GET /catalog/categories/0/children` returns the root categories (start of the tree).
      operationId: listCategoryChildren
      x-scope: category.read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/ancestors:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags:
        - Categories
      summary: Get category path
      description: |
        Path from the root category down to this category (inclusive), for
        breadcrumbs. Example: `[Fashion, Pria, Kaos]`. Not paginated.
      operationId: listCategoryAncestors
      x-scope: category.read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/mappings:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
    get:
      tags:
        - Category Mappings
      summary: List category mappings
      description: |
        Leaf categories with their marketplace mappings, sorted by `full_name`.
        `mappings` only contains channels that are mapped and enabled for the
        Open API (see `ChannelId`).
      operationId: listCategoryMappings
      x-scope: category.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CategoryMappingItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Category Mappings
      summary: Map category to a marketplace category
      description: |
        Creates or replaces the mapping of a category for one channel (idempotent):
        send `category_id`, `channel_id` and `channel_category_id` in the body.

        **Warning:** saving a mapping resets the attribute and variation mappings
        of this category for this channel to their defaults (required attributes only).
        Any custom attribute or variation mapping for this channel is lost.

        Only available for merchants with custom categories enabled.
      operationId: saveCategoryMapping
      x-scope: category.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryMappingInput"
      responses:
        "200":
          description: Mapping saved
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CategoryMapping"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CustomCategoryDisabled"
        "422":
          description: |
            Marketplace category does not exist for this channel.
            Error code: `channel_category_not_found`.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                data: null
                meta: null
                error:
                  code: channel_category_not_found
                  message: channel_category_not_found
                request_id: 3f6c2a5e-8f0e-4b8e-9a51-2f0c7d1e4b11
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/mappings/{channel_id}/attributes:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags:
        - Category Mappings
      summary: List attribute mappings
      description: Jubelio attributes of the category and the marketplace attribute each one maps to on this channel.
      operationId: listAttributeMappings
      x-scope: category.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AttributeMapping"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryMappingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/mappings/{channel_id}/attribute-options:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags:
        - Category Mappings
      summary: List marketplace attribute options
      description: Attributes available on the mapped marketplace category. Not paginated.
      operationId: listAttributeOptions
      x-scope: category.read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AttributeOption"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryMappingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/mappings/{channel_id}/variations:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags:
        - Category Mappings
      summary: List variation mappings
      description: Jubelio variations of the category and the marketplace variation each one maps to on this channel.
      operationId: listVariationMappings
      x-scope: category.read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Q"
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VariationMapping"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryMappingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/{category_id}/mappings/{channel_id}/variation-options:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/ChannelId"
    get:
      tags:
        - Category Mappings
      summary: List marketplace variation options
      description: Variations available on the mapped marketplace category. Not paginated.
      operationId: listVariationOptions
      x-scope: category.read
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/VariationOption"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryMappingNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /catalog/categories/channel-categories/{channel_id}/{channel_category_id}:
    parameters:
      - $ref: "#/components/parameters/JblMerchantId"
      - $ref: "#/components/parameters/ChannelId"
      - name: channel_category_id
        in: path
        required: true
        description: Marketplace category id (string, owned by the marketplace). Use `0` to list the channel's root categories.
        schema:
          type: string
          example: "62544801"
    get:
      tags:
        - Channel Categories
      summary: Get marketplace category with its path and children
      description: |
        Marketplace category master data, the same for all merchants. Returns the
        category, its ancestors (root down to the direct parent) and its direct children.
        Requires a valid token but no scope.

        `GET /catalog/categories/channel-categories/{channel_id}/0` returns the channel's root categories
        in `children` (start of the tree), with `category: null` and `ancestors: []`.
      operationId: getChannelCategory
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChannelCategoryDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Marketplace category not found for this channel.
            Error code: `channel_category_not_found`.
