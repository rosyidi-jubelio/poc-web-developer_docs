      summary: Create a supplier payment
      description: |
        Records a payment made to a supplier for one or more of their bills,
        with an automatic payment number. Payments cannot be updated or
        deleted through the API.
        Requires scope `finance.supplier_payment.create`.

        **Per line** send `bill_id`. `amount` (paid in cash or bank) and
        `downpayment_amount` (covered by the purchase order down payment) are
        optional. By default the available down payment is used first and
        `amount` is the rest of the bill. When only `amount` is sent, the
        down payment covers what is left after it. `amount` +
        `downpayment_amount` must not exceed what is still owed on the bill.
        Bills of the same purchase order share its down payment: a line can
        only use what earlier lines left over.

        **Automatic deductions:** like when the merchant picks a bill in
        Jubelio, income tax for items that have a purchase income tax is
        deducted from the line by itself (minus what earlier payments of the
        bill already deducted). It shows with `is_automatic: true`.

        `adjustments` add (`addition`) or subtract (`deduction`) amounts from
        the cash paid out, e.g. bank fees, booked to the given account. The
        payment `amount` is the cash paid out: the sum of each line's
