      summary: Update product SKUs
      description: |
        Sends the full list of SKUs:
        - existing SKUs (with `sku_id`) **must all be sent**: SKUs cannot be removed.
          Archived SKUs may be left out; they are kept.
        - new SKUs are sent without `sku_id`; their `sell_price` is the initial price.
