          schema:
            type: string
        - name: status
          in: query
          description: Only active or closed orders. Both when left out.
          schema:
            type: string
            enum:
              - active
              - closed
        - name: transaction_date_from
          in: query
          description: Only orders with a transaction date on or after this time (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: transaction_date_to
