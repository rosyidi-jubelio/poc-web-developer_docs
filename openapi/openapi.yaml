        transaction_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
    ActionResult:
      type: object
      description: Generic result for write endpoints that don't return a resource.
      properties:
        status:
          type: string
          enum:
            - ok
    Category:
      type: object
