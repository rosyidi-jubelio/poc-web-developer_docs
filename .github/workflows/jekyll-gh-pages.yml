# Builds the Docusaurus portal and deploys it to GitHub Pages.
# (The file keeps the name of GitHub's Pages starter workflow, but nothing here uses Jekyll.)
#
# Setup, once:
# 1. Settings > Pages > Build and deployment > Source: GitHub Actions.
# 2. Settings > Secrets and variables > Actions:
#    - Secret SPEC_REPO_TOKEN: a fine-grained token with read access to "Contents" of the
#      repository that holds the OpenAPI spec.
#    - Variable SPEC_REPOSITORY (optional): owner/name of that repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout OpenAPI spec
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SPEC_REPOSITORY || 'rosyidi-jubelio/app-store-technical-docs' }}
          token: ${{ secrets.SPEC_REPO_TOKEN }}
          path: _spec-source
          sparse-checkout: docs/open-api/api/openapi.yaml
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # `npm run build` syncs the spec, generates the API reference, runs the
      # public-safety check and builds the site.
      - name: Build
        run: npm run build
        env:
          OPENAPI_SPEC_PATH: _spec-source/docs/open-api/api/openapi.yaml
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
